dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation project(':dwp-core')
    implementation project(':dwp-audit')
    implementation project(':dwp-platform-contracts')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.postgresql:postgresql'
}

tasks.named('test') {
    inputs.file(rootProject.file('contracts/asyncapi/domain-events.yaml'))
            .withPropertyName('domainEventsAsyncApi')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file(
            'contracts/hris/canonical/schemas/cross-module-canonical-schemas.v1.json'))
            .withPropertyName('hrisCanonicalSchemas')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file(
            'contracts/in-process/hris/workforce-snapshot-query-port.v1.schema.json'))
            .withPropertyName('workforceSnapshotQueryPortSchema')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
