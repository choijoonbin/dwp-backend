server:
  port: 8003

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-people-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PEOPLE_DB_NAME:dwp_people}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: ${DWP_PEOPLE_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  http:
    client:
      connect-timeout: ${DWP_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${DWP_HTTP_READ_TIMEOUT:5s}
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  identity-sync:
    enabled: ${DWP_IDENTITY_SYNC_ENABLED:false}
    auth-url: ${SERVICE_AUTH_URL:http://localhost:8001}
    token: ${DWP_IDENTITY_SYNC_TOKEN:}
    batch-size: ${DWP_IDENTITY_SYNC_BATCH_SIZE:50}
    maximum-attempts: ${DWP_IDENTITY_SYNC_MAXIMUM_ATTEMPTS:10}
    publish-interval-ms: ${DWP_IDENTITY_SYNC_PUBLISH_INTERVAL_MS:2000}
  provider:
    provisioning-token: ${DWP_PROVIDER_PROVISIONING_TOKEN:}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  people:
    service-token: ${DWP_PEOPLE_SERVICE_TOKEN:}
    product-authorization-v3-enabled: ${DWP_HCM_PRODUCT_AUTHORIZATION_V3_ENABLED:false}
    step-up:
      public-key-pem: ${DWP_PEOPLE_STEP_UP_PUBLIC_KEY_PEM:}
      issuer: ${DWP_PEOPLE_STEP_UP_ISSUER:}
      audience: ${DWP_PEOPLE_STEP_UP_AUDIENCE:dwp-people-server}
      key-id: ${DWP_PEOPLE_STEP_UP_KEY_ID:}
      required-acr: ${DWP_PEOPLE_STEP_UP_REQUIRED_ACR:urn:dwp:acr:mfa}
      maximum-authentication-age-seconds: ${DWP_PEOPLE_STEP_UP_MAX_AUTH_AGE_SECONDS:600}
      maximum-challenge-ttl-seconds: ${DWP_PEOPLE_STEP_UP_MAX_TTL_SECONDS:900}
      ledger-purge-batch-size: ${DWP_PEOPLE_STEP_UP_LEDGER_PURGE_BATCH_SIZE:500}
      ledger-purge-delay-ms: ${DWP_PEOPLE_STEP_UP_LEDGER_PURGE_DELAY_MS:900000}
    cursor-secret: ${DWP_PEOPLE_CURSOR_SECRET:}
    cursor-ttl: ${DWP_PEOPLE_CURSOR_TTL:PT15M}
    synthetic-import-enabled: ${DWP_SYNTHETIC_IMPORT_ENABLED:false}
    hris:
      allowed-hosts: ${DWP_HRIS_ALLOWED_HOSTS:}
      allow-unlisted-hosts: ${DWP_HRIS_ALLOW_UNLISTED_HOSTS:false}
    exports:
      execution-enabled: ${DWP_WORKFORCE_EXPORT_EXECUTION_ENABLED:false}
      blockers: ${DWP_WORKFORCE_EXPORT_BLOCKERS:D-09,D-12}
      masking-profile: ${DWP_WORKFORCE_EXPORT_MASKING_PROFILE:WORKFORCE_MINIMUM}
      watermark-template: ${DWP_WORKFORCE_EXPORT_WATERMARK_TEMPLATE:DWP confidential | tenant={{tenantId}} | requester={{userId}} | recipient={{recipient}} | request={{requestId}}}
      artifact-ttl-hours: ${DWP_WORKFORCE_EXPORT_ARTIFACT_TTL_HOURS:24}
      maximum-attempts: ${DWP_WORKFORCE_EXPORT_MAXIMUM_ATTEMPTS:5}
      maximum-manual-retries: ${DWP_WORKFORCE_EXPORT_MAXIMUM_MANUAL_RETRIES:1}
      expiry-scan-interval-ms: ${DWP_WORKFORCE_EXPORT_EXPIRY_SCAN_INTERVAL_MS:60000}
      expiry-scan-batch-size: ${DWP_WORKFORCE_EXPORT_EXPIRY_SCAN_BATCH_SIZE:100}
      worker:
        batch-size: ${DWP_WORKFORCE_EXPORT_BATCH_SIZE:10}
        poll-interval-ms: ${DWP_WORKFORCE_EXPORT_POLL_INTERVAL_MS:5000}
        reference: ${DWP_WORKFORCE_EXPORT_WORKER_REFERENCE:${HOSTNAME:local}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.people: ${LOG_LEVEL_PEOPLE:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    configs:
      idempotent:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      idempotentInternal:
        base-config: idempotent
      idempotentConnector:
        base-config: idempotent
