server:
  port: ${DWP_TIME_SERVER_PORT:8011}
  shutdown: graceful

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

time:
  projection-publisher:
    username: ${TIME_PROJECTION_PUBLISHER_DB_USERNAME:dwp_time_projection_publisher}

spring:
  application:
    name: dwp-time-server
  lifecycle:
    timeout-per-shutdown-phase: ${DWP_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TIME_DB_NAME:dwp_time}
    username: ${TIME_DB_USERNAME:dwp_time_runtime}
    password: ${TIME_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET search_path TO pg_catalog, public
      maximum-pool-size: ${DWP_TIME_DB_POOL_SIZE:20}
      auto-commit: false
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TIME_DB_NAME:dwp_time}
    user: ${TIME_MIGRATION_DB_USERNAME:}
    password: ${TIME_MIGRATION_DB_PASSWORD:}
    locations: ${DWP_TIME_FLYWAY_LOCATIONS:classpath:db/migration}
    default-schema: public
    schemas:
      - public
    table: flyway_schema_history
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: true
    create-schemas: false
    placeholder-replacement: true
    clean-on-validation-error: false
    group: false
    mixed: false
    skip-default-callbacks: false
    skip-default-resolvers: false
    validate-migration-naming: true
    execute-in-transaction: true
    output-query-results: false
    community-db-support-enabled: false
    skip-executing-migrations: false
    ignore-migration-patterns: []
    connect-retries: 3
    lock-retry-count: 10
    placeholders:
      timeRuntimeRole: ${TIME_DB_USERNAME:dwp_time_runtime}
      timeProjectionPublisherRole: ${time.projection-publisher.username}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false

dwp:
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  time:
    database:
      adoption-receipt-sha256: ${DWP_TIME_ADOPTION_RECEIPT_SHA256:}
      adoption-control-reference: ${DWP_TIME_ADOPTION_CONTROL_REFERENCE:}
      control-run-receipt-json: ${DWP_TIME_MIGRATION_CONTROL_RUN_RECEIPT_JSON:}
      control-run-receipt-sha256: ${DWP_TIME_MIGRATION_CONTROL_RUN_RECEIPT_SHA256:}
      migration-control-reference: ${DWP_TIME_MIGRATION_CONTROL_REFERENCE:}
    service-token: ${DWP_TIME_SERVICE_TOKEN:}
    product-authorization-enabled: ${DWP_TIME_PRODUCT_AUTHORIZATION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.time: ${LOG_LEVEL_TIME:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    configs:
      idempotent:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
