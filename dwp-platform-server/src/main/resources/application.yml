server:
  port: 8002

spring:
  application:
    name: dwp-platform-server
  servlet:
    multipart:
      max-file-size: ${DWP_HOME_ASSET_MAX_FILE_SIZE:10MB}
      max-request-size: ${DWP_HOME_ASSET_MAX_REQUEST_SIZE:11MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PLATFORM_DB_NAME:dwp_platform}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  platform:
    service-token: ${DWP_PLATFORM_SERVICE_TOKEN:}
    runtime-service-token: ${DWP_PLATFORM_RUNTIME_SERVICE_TOKEN:}
    assets:
      root: ${DWP_PLATFORM_ASSET_DIR:${DWP_HOME_ASSET_DIR:${user.home}/.dwp/platform-assets}}
    home-assets:
      max-bytes: ${DWP_HOME_ASSET_MAX_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.platform: ${LOG_LEVEL_PLATFORM:INFO}
