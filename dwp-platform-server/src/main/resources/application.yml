server:
  port: 8002

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-platform-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
  servlet:
    multipart:
      max-file-size: ${DWP_PLATFORM_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${DWP_PLATFORM_MULTIPART_MAX_REQUEST_SIZE:26MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PLATFORM_DB_NAME:dwp_platform}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  workplace:
    provider-integration:
      http:
        # Production relay is opt-in and fails startup unless its HTTPS host/provider allowlists
        # are explicit. Credentials remain opaque secret-manager references owned by an injected
        # WorkplaceProviderSecretOwner implementation.
        enabled: ${DWP_WORKPLACE_PROVIDER_HTTP_ENABLED:false}
        base-url: ${DWP_WORKPLACE_PROVIDER_HTTP_BASE_URL:}
        allowed-hosts: ${DWP_WORKPLACE_PROVIDER_HTTP_ALLOWED_HOSTS:}
        allowed-providers: ${DWP_WORKPLACE_PROVIDER_HTTP_ALLOWED_PROVIDERS:}
        allow-insecure-localhost: ${DWP_WORKPLACE_PROVIDER_HTTP_ALLOW_INSECURE_LOCALHOST:false}
    visits:
      provider-relay:
        # Comma separated PROVIDER@VERSION=secret-manager://opaque/reference bindings. Keeping
        # older version references enables safe status reconciliation after configuration changes.
        # Raw credentials are leased by WorkplaceProviderSecretOwner and are never stored here.
        credential-references: ${DWP_WORKPLACE_VISIT_PROVIDER_CREDENTIAL_REFERENCES:}
        guest-provider-code: ${DWP_WORKPLACE_VISIT_GUEST_PROVIDER_CODE:}
        guest-provider-configuration-version: ${DWP_WORKPLACE_VISIT_GUEST_PROVIDER_CONFIGURATION_VERSION:0}
        guest-reference-prefixes: ${DWP_WORKPLACE_VISIT_GUEST_REFERENCE_PREFIXES:}
      provider-worker:
        enabled: ${DWP_WORKPLACE_VISIT_PROVIDER_WORKER_ENABLED:true}
        batch-size: ${DWP_WORKPLACE_VISIT_PROVIDER_WORKER_BATCH_SIZE:50}
        processing-timeout: ${DWP_WORKPLACE_VISIT_PROVIDER_PROCESSING_TIMEOUT:PT2M}
        poll-delay-ms: ${DWP_WORKPLACE_VISIT_PROVIDER_POLL_DELAY_MS:2000}
    services:
      provider-relay:
        # Explicit adapter allowlist. Provider profiles persist only an opaque
        # secret-manager:// reference captured with each accepted operation.
        adapter-types: ${DWP_WORKPLACE_SERVICE_PROVIDER_ADAPTER_TYPES:}
      provider-worker:
        enabled: ${DWP_WORKPLACE_SERVICE_PROVIDER_WORKER_ENABLED:true}
        batch-size: ${DWP_WORKPLACE_SERVICE_PROVIDER_WORKER_BATCH_SIZE:50}
        poll-delay-ms: ${DWP_WORKPLACE_SERVICE_PROVIDER_POLL_DELAY_MS:5000}
    navigation:
      device-provider:
        # Comma separated PROVIDER@VERSION=secret-manager://opaque/reference bindings.
        # Retain older version references while an accepted command may still be reconciled.
        credential-references: ${DWP_WORKPLACE_NAVIGATION_DEVICE_PROVIDER_CREDENTIAL_REFERENCES:}
      command-worker:
        enabled: ${DWP_WORKPLACE_NAVIGATION_COMMAND_WORKER_ENABLED:true}
        batch-size: ${DWP_WORKPLACE_NAVIGATION_COMMAND_WORKER_BATCH_SIZE:20}
        processing-timeout: ${DWP_WORKPLACE_NAVIGATION_COMMAND_PROCESSING_TIMEOUT:PT2M}
        poll-delay-ms: ${DWP_WORKPLACE_NAVIGATION_COMMAND_POLL_DELAY_MS:2000}
      provider-observation:
        enabled: ${DWP_WORKPLACE_NAVIGATION_PROVIDER_OBSERVATION_ENABLED:true}
        batch-size: ${DWP_WORKPLACE_NAVIGATION_PROVIDER_OBSERVATION_BATCH_SIZE:50}
        poll-delay-ms: ${DWP_WORKPLACE_NAVIGATION_PROVIDER_OBSERVATION_POLL_DELAY_MS:60000}
    safety:
      provider-relay:
        # PROVIDER@VERSION=secret-manager://opaque/reference entries retain old versions so
        # crash recovery always returns to the provider configuration captured at dispatch.
        credential-references: ${DWP_WORKPLACE_SAFETY_PROVIDER_CREDENTIAL_REFERENCES:}
        # APP_PUSH=PROVIDER@VERSION,SMS=...,EMAIL=...; EBS/BLE use their governed connector row.
        channel-bindings: ${DWP_WORKPLACE_SAFETY_PROVIDER_CHANNEL_BINDINGS:}
      dispatch-worker-enabled: ${DWP_WORKPLACE_SAFETY_DISPATCH_WORKER_ENABLED:true}
      dispatch-worker-batch-size: ${DWP_WORKPLACE_SAFETY_DISPATCH_WORKER_BATCH_SIZE:50}
      dispatch-worker-delay-ms: ${DWP_WORKPLACE_SAFETY_DISPATCH_WORKER_DELAY_MS:2000}
      dispatch-processing-timeout: ${DWP_WORKPLACE_SAFETY_DISPATCH_PROCESSING_TIMEOUT:PT2M}
      connector-freshness: ${DWP_WORKPLACE_SAFETY_CONNECTOR_FRESHNESS:PT5M}
      connector-observation-producer-enabled: ${DWP_WORKPLACE_SAFETY_CONNECTOR_OBSERVATION_PRODUCER_ENABLED:false}
      connector-observation-batch-size: ${DWP_WORKPLACE_SAFETY_CONNECTOR_OBSERVATION_BATCH_SIZE:50}
      connector-observation-delay-ms: ${DWP_WORKPLACE_SAFETY_CONNECTOR_OBSERVATION_DELAY_MS:60000}
    connector-runtime:
      freshness: ${DWP_WORKPLACE_CONNECTOR_RUNTIME_FRESHNESS:PT5M}
      replay-preview-ttl: ${DWP_WORKPLACE_CONNECTOR_REPLAY_PREVIEW_TTL:PT10M}
      replay-worker-enabled: ${DWP_WORKPLACE_CONNECTOR_REPLAY_WORKER_ENABLED:true}
      replay-worker-batch-size: ${DWP_WORKPLACE_CONNECTOR_REPLAY_WORKER_BATCH_SIZE:20}
      replay-worker-delay-ms: ${DWP_WORKPLACE_CONNECTOR_REPLAY_WORKER_DELAY_MS:2000}
      observation-consumer-enabled: ${DWP_WORKPLACE_CONNECTOR_OBSERVATION_CONSUMER_ENABLED:false}
      observation-producer-enabled: ${DWP_WORKPLACE_CONNECTOR_OBSERVATION_PRODUCER_ENABLED:false}
      observation-producer-batch-size: ${DWP_WORKPLACE_CONNECTOR_OBSERVATION_PRODUCER_BATCH_SIZE:50}
      observation-producer-delay-ms: ${DWP_WORKPLACE_CONNECTOR_OBSERVATION_PRODUCER_DELAY_MS:60000}
      sensitive-payload-retention: ${DWP_WORKPLACE_CONNECTOR_SENSITIVE_RETENTION:PT2160H}
      retention-enabled: ${DWP_WORKPLACE_CONNECTOR_RETENTION_ENABLED:true}
      retention-batch-size: ${DWP_WORKPLACE_CONNECTOR_RETENTION_BATCH_SIZE:200}
      retention-cron: ${DWP_WORKPLACE_CONNECTOR_RETENTION_CRON:0 37 2 * * *}
  workspace:
    # Requires approved Kafka consumer onboarding; queue projection remains off by default.
    identity-governance-consumer-enabled: ${DWP_IDENTITY_GOVERNANCE_CONSUMER_ENABLED:false}
  http:
    client:
      connect-timeout: ${DWP_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${DWP_HTTP_READ_TIMEOUT:5s}
  identity-sync:
    auth-url: ${SERVICE_AUTH_URL:http://localhost:8001}
    token: ${DWP_IDENTITY_SYNC_TOKEN:}
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  provider:
    provisioning-token: ${DWP_PROVIDER_PROVISIONING_TOKEN:}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  platform:
    service-token: ${DWP_PLATFORM_SERVICE_TOKEN:}
    runtime-service-token: ${DWP_PLATFORM_RUNTIME_SERVICE_TOKEN:}
    activity:
      # Local UI evidence stays SAMPLE and is invisible unless the server is explicitly opted in.
      local-fixtures-enabled: ${DWP_ACTIVITY_LOCAL_FIXTURES_ENABLED:false}
    # Deny-only interlock: true intentionally fails startup until the authoritative runtime exists.
    widget-registry-enabled: ${DWP_WIDGET_REGISTRY_ENABLED:false}
    home:
      flow-enabled: ${DWP_HOME_FLOW_ENABLED:false}
      personalization-v2-enabled: ${DWP_HOME_PERSONALIZATION_V2_ENABLED:false}
      composer-enabled: ${DWP_HOME_COMPOSER_ENABLED:false}
      views-dual-write-enabled: ${DWP_HOME_VIEWS_DUAL_WRITE_ENABLED:false}
      personalization-maintenance:
        enabled: ${DWP_HOME_PERSONALIZATION_MAINTENANCE_ENABLED:false}
        cron: ${DWP_HOME_PERSONALIZATION_MAINTENANCE_CRON:0 41 3 * * *}
        receipt-retention-hours: ${DWP_HOME_RECEIPT_RETENTION_HOURS:24}
        preview-proposal-retention-days: ${DWP_HOME_PREVIEW_PROPOSAL_RETENTION_DAYS:7}
        finalized-proposal-retention-days: ${DWP_HOME_FINALIZED_PROPOSAL_RETENTION_DAYS:90}
        revision-retention-days: ${DWP_HOME_REVISION_RETENTION_DAYS:365}
        tombstone-retention-days: ${DWP_HOME_TOMBSTONE_RETENTION_DAYS:365}
        revision-retention-per-object: ${DWP_HOME_REVISION_RETENTION_PER_OBJECT:100}
      views-shadow-compare-enabled: ${DWP_HOME_VIEWS_SHADOW_COMPARE_ENABLED:false}
      views-read-enabled: ${DWP_HOME_VIEWS_READ_ENABLED:false}
    product-authorization-approvals-v2-enabled: ${DWP_PLATFORM_PRODUCT_AUTHORIZATION_APPROVALS_V2_ENABLED:false}
    product-authorization-dwaion-v6-enabled: ${DWP_PLATFORM_PRODUCT_AUTHORIZATION_DWAION_V6_ENABLED:false}
    product-surface-telemetry:
      collection-enabled: ${DWP_PRODUCT_SURFACE_TELEMETRY_COLLECTION_ENABLED:false}
      maintenance-enabled: ${DWP_PRODUCT_SURFACE_TELEMETRY_MAINTENANCE_ENABLED:true}
      maintenance-batch-size: ${DWP_PRODUCT_SURFACE_TELEMETRY_MAINTENANCE_BATCH_SIZE:1000}
      maintenance-cron: ${DWP_PRODUCT_SURFACE_TELEMETRY_MAINTENANCE_CRON:0 41 2 * * *}
    api-history:
      cursor-secret: ${DWP_API_HISTORY_CURSOR_SECRET:}
      cursor-ttl: ${DWP_API_HISTORY_CURSOR_TTL:PT15M}
      retention-days: ${DWP_API_HISTORY_RETENTION_DAYS:90}
      allowed-services: ${DWP_API_HISTORY_ALLOWED_SERVICES:dwp-gateway,dwp-auth-server,dwp-platform-server,dwp-people-server,dwp-provider-server,dwp-approval-server,dwp-space-server,dwp-messaging-server,dwp-meeting-server,dwp-notification-server,dwp-agent-runtime}
    audit:
      allowed-services: ${DWP_AUDIT_ALLOWED_SERVICES:dwp-gateway,dwp-auth-server,dwp-platform-server,dwp-people-server,dwp-provider-server,dwp-approval-server,dwp-space-server,dwp-messaging-server,dwp-meeting-server,dwp-notification-server,dwp-agent-runtime}
      integrity-secret: ${DWP_AUDIT_INTEGRITY_SECRET:}
      integrity-cron: ${DWP_AUDIT_INTEGRITY_CRON:0 15 0 * * *}
      retention-cron: ${DWP_AUDIT_RETENTION_CRON:0 10 2 * * *}
    assets:
      storage: ${DWP_PLATFORM_ASSET_STORAGE:local}
      root: ${DWP_PLATFORM_ASSET_DIR:${DWP_HOME_ASSET_DIR:${user.home}/.dwp/platform-assets}}
      s3:
        bucket: ${DWP_PLATFORM_ASSET_S3_BUCKET:}
        region: ${DWP_PLATFORM_ASSET_S3_REGION:ap-northeast-2}
        endpoint: ${DWP_PLATFORM_ASSET_S3_ENDPOINT:}
        path-style-access: ${DWP_PLATFORM_ASSET_S3_PATH_STYLE:false}
        prefix: ${DWP_PLATFORM_ASSET_S3_PREFIX:dwp-platform}
        kms-key-id: ${DWP_PLATFORM_ASSET_S3_KMS_KEY_ID:}
    home-assets:
      max-bytes: ${DWP_HOME_ASSET_MAX_BYTES:10485760}
    productivity:
      data-key: ${DWP_PRODUCTIVITY_DATA_KEY:}
      sync:
        enabled: ${DWP_PRODUCTIVITY_SYNC_ENABLED:false}
        max-pages-per-run: ${DWP_PRODUCTIVITY_MAX_PAGES_PER_RUN:10}
      microsoft-graph:
        authorize-base-url: ${DWP_MS_GRAPH_AUTHORIZE_BASE_URL:https://login.microsoftonline.com}
        api-base-url: ${DWP_MS_GRAPH_API_BASE_URL:https://graph.microsoft.com}
    mail:
      delivery:
        enabled: ${DWP_MAIL_DELIVERY_ENABLED:true}
        batch-size: ${DWP_MAIL_DELIVERY_BATCH_SIZE:25}
        lease-seconds: ${DWP_MAIL_DELIVERY_LEASE_SECONDS:30}
        maximum-attempts: ${DWP_MAIL_DELIVERY_MAXIMUM_ATTEMPTS:5}
        poll-delay-ms: ${DWP_MAIL_DELIVERY_POLL_DELAY_MS:1000}
        worker-id: ${DWP_MAIL_DELIVERY_WORKER_ID:${HOSTNAME:local}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.platform: ${LOG_LEVEL_PLATFORM:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    configs:
      idempotent:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      idempotentInternal:
        base-config: idempotent
      idempotentConnector:
        base-config: idempotent
