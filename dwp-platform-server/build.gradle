dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'software.amazon.awssdk:s3:2.53.3'
    implementation 'software.amazon.awssdk:url-connection-client:2.53.3'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.jsoup:jsoup:1.17.2'
    // Optional, fail-closed distributed admission for Home shadow-comparison metrics.
    // The client is created only when the Home admission property is enabled.
    implementation 'io.lettuce:lettuce-core'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation project(':dwp-core')
    implementation project(':dwp-audit')
    implementation project(':dwp-observability')
    implementation project(':dwp-platform-contracts')

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.postgresql:postgresql'
}
