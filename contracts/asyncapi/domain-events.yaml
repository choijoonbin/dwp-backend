asyncapi: 3.0.0
info:
  title: DWP Domain Events
  version: 1.2.0
  description: Versioned CloudEvents-aligned contracts published from transactional outboxes.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  domainEvents:
    address: dwp.domain-events.v1
    messages:
      domainEvent:
        $ref: '#/components/messages/domainEvent'
      workplaceBookingEvent:
        $ref: '#/components/messages/workplaceBookingEvent'
      performancePopulationFrozen:
        $ref: '#/components/messages/performancePopulationFrozen'
      clockEventRecorded:
        $ref: '#/components/messages/clockEventRecorded'
      employeeChangeApplied:
        $ref: '#/components/messages/employeeChangeApplied'
      performanceReviewSubmitted:
        $ref: '#/components/messages/performanceReviewSubmitted'
      timecardDecisionRecorded:
        $ref: '#/components/messages/timecardDecisionRecorded'
      controlledTransferStateChanged:
        $ref: '#/components/messages/controlledTransferStateChanged'
  workplaceOccupancySignals:
    address: dwp.workplace.occupancy-signals.v1
    messages:
      workplaceOccupancySignal:
        $ref: '#/components/messages/workplaceOccupancySignal'
operations:
  publishDomainEvent:
    action: send
    channel:
      $ref: '#/channels/domainEvents'
    messages:
      - $ref: '#/channels/domainEvents/messages/domainEvent'
      - $ref: '#/channels/domainEvents/messages/workplaceBookingEvent'
      - $ref: '#/channels/domainEvents/messages/performancePopulationFrozen'
      - $ref: '#/channels/domainEvents/messages/clockEventRecorded'
      - $ref: '#/channels/domainEvents/messages/employeeChangeApplied'
      - $ref: '#/channels/domainEvents/messages/performanceReviewSubmitted'
      - $ref: '#/channels/domainEvents/messages/timecardDecisionRecorded'
      - $ref: '#/channels/domainEvents/messages/controlledTransferStateChanged'
  receiveWorkplaceOccupancySignal:
    action: receive
    channel:
      $ref: '#/channels/workplaceOccupancySignals'
    messages:
      - $ref: '#/channels/workplaceOccupancySignals/messages/workplaceOccupancySignal'
components:
  messages:
    domainEvent:
      name: DomainEventEnvelope
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DomainEventEnvelope'
    workplaceBookingEvent:
      name: WorkplaceBookingEvent
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkplaceBookingEventEnvelope'
    performancePopulationFrozen:
      name: PerformancePopulationFrozen.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PerformancePopulationFrozenEnvelope'
    clockEventRecorded:
      name: ClockEventRecorded.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ClockEventRecordedEnvelope'
    employeeChangeApplied:
      name: EmployeeChangeApplied.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EmployeeChangeAppliedEnvelope'
    performanceReviewSubmitted:
      name: PerformanceReviewSubmitted.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PerformanceReviewSubmittedEnvelope'
    timecardDecisionRecorded:
      name: TimecardDecisionRecorded.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/TimecardDecisionRecordedEnvelope'
    controlledTransferStateChanged:
      name: dwp.hris.controlled-transfer.state-changed.v1
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ControlledTransferStateChangedEnvelope'
    workplaceOccupancySignal:
      name: WorkplaceOccupancySignal
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WorkplaceOccupancySignal'
  schemas:
    DomainEventEnvelope:
      type: object
      additionalProperties: false
      required:
        - specVersion
        - id
        - source
        - type
        - schemaVersion
        - time
        - aggregateType
        - aggregateId
        - aggregateSequence
        - correlationId
        - data
      properties:
        specVersion:
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          maxLength: 240
        type:
          type: string
          maxLength: 240
        schemaVersion:
          type: integer
          minimum: 1
        time:
          type: string
          format: date-time
        subject:
          type: [string, 'null']
          maxLength: 320
        tenantId:
          type: [integer, 'null']
          minimum: 1
        aggregateType:
          type: string
          maxLength: 120
        aggregateId:
          type: string
          maxLength: 240
        aggregateSequence:
          type: integer
          minimum: 1
        correlationId:
          type: string
          maxLength: 160
        causationId:
          type: [string, 'null']
          maxLength: 160
        traceParent:
          type: [string, 'null']
          pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        data:
          type: object
        extensions:
          type: object
          additionalProperties:
            type: string
    WorkplaceBookingEventEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          properties:
            type:
              enum:
                - workplace.booking.created.v1
                - workplace.booking.relocated.v1
                - workplace.booking.checked-in.v1
                - workplace.booking.released.v1
                - workplace.booking.cancelled.v1
                - workplace.booking.completed.v1
                - workplace.booking.no-show.v1
            data:
              $ref: '#/components/schemas/WorkplaceBookingEventData'
    WorkplaceBookingEventData:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - resourceId
        - siteId
        - floorId
        - status
        - startsAt
        - endsAt
      properties:
        bookingId:
          type: string
          format: uuid
        seriesId:
          type: [string, 'null']
          format: uuid
        resourceId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        floorId:
          type: string
          format: uuid
        status:
          enum: [RESERVED, CHECKED_IN, COMPLETED, NO_SHOW, RELEASED, CANCELLED]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        reasonCode:
          type: [string, 'null']
          maxLength: 80
    PerformancePopulationFrozenEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: PerformancePopulationFrozen.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: PERFORMANCE_POPULATION_FREEZE
            data:
              $ref: '#/components/schemas/PerformancePopulationFrozenData'
    PerformancePopulationFrozenData:
      type: object
      additionalProperties: false
      required:
        - cycleVersionId
        - populationFreezeId
        - workforceSnapshotId
        - workforceSnapshotRevision
        - participantCount
        - reviewerAssignmentCount
        - contentHash
      properties:
        cycleVersionId:
          type: string
          format: uuid
        populationFreezeId:
          type: string
          format: uuid
        workforceSnapshotId:
          type: string
          format: uuid
        workforceSnapshotRevision:
          type: integer
          minimum: 1
        participantCount:
          type: integer
          minimum: 0
        reviewerAssignmentCount:
          type: integer
          minimum: 0
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ClockEventRecordedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: ClockEventRecorded.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: ClockStream
            data:
              $ref: '#/components/schemas/ClockEventRecordedData'
    ClockEventRecordedData:
      type: object
      additionalProperties: false
      required:
        - clockEventId
        - workerId
        - eventType
        - occurredAt
        - sourceId
        - sourceOffsetMinutes
        - payloadDigest
        - sourceSequence
        - sourceProvenanceDigest
        - voidsClockEventId
      properties:
        clockEventId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        eventType:
          enum: [IN, OUT, BREAK_START, BREAK_END, VOID]
        occurredAt:
          type: string
          format: date-time
        sourceId:
          type: string
          format: uuid
        sourceOffsetMinutes:
          type: integer
          minimum: -840
          maximum: 840
        payloadDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sourceSequence:
          type: [integer, 'null']
          minimum: 1
        sourceProvenanceDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        voidsClockEventId:
          type: [string, 'null']
          format: uuid
    EmployeeChangeAppliedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: EmployeeChangeApplied.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: EmployeeChangeRequest
            data:
              $ref: '#/components/schemas/EmployeeChangeAppliedData'
    EmployeeChangeAppliedData:
      $ref: '../hris/canonical/schemas/cross-module-canonical-schemas.v1.json#/$defs/XCON_022'
    PerformanceReviewSubmittedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: PerformanceReviewSubmitted.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: PERFORMANCE_REVIEW
            data:
              $ref: '#/components/schemas/PerformanceReviewSubmittedData'
    PerformanceReviewSubmittedData:
      type: object
      additionalProperties: false
      required:
        - reviewId
        - participantId
        - reviewerAssignmentId
        - submissionId
        - templateVersionId
        - contentHash
      properties:
        reviewId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        reviewerAssignmentId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        templateVersionId:
          type: string
          format: uuid
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    TimecardDecisionRecordedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: TimecardDecisionRecorded.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: TIMECARD
            data:
              $ref: '#/components/schemas/TimecardDecisionRecordedData'
    TimecardDecisionRecordedData:
      type: object
      additionalProperties: false
      required:
        - timecardId
        - workerId
        - status
        - ledgerRevision
        - decisionAt
      properties:
        timecardId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        status:
          enum: [APPROVED, REJECTED, CORRECTION_REQUIRED]
        ledgerRevision:
          type: integer
          minimum: 1
        decisionAt:
          type: string
          format: date-time
    ControlledTransferStateChangedEnvelope:
      allOf:
        - $ref: '#/components/schemas/DomainEventEnvelope'
        - type: object
          required:
            - type
            - schemaVersion
            - aggregateType
            - data
          properties:
            type:
              const: dwp.hris.controlled-transfer.state-changed.v1
            schemaVersion:
              const: 1
            aggregateType:
              const: CONTROLLED_TRANSFER
            data:
              $ref: '#/components/schemas/ControlledTransferStateChangedData'
    ControlledTransferStateChangedData:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              transferKind:
                const: INGEST
            required: [transferKind]
          then:
            properties:
              egressPolicyRevision:
                type: 'null'
          else:
            properties:
              egressPolicyRevision:
                type: integer
                minimum: 1
        - if:
            properties:
              state:
                const: COMPLETED
            required: [state]
          then:
            properties:
              receiptDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      required:
        - transferPublicId
        - ownerModule
        - transferKind
        - purposeCode
        - state
        - objectVersion
        - objectDigest
        - byteSize
        - mediaType
        - metadataSnapshotDigest
        - egressPolicyRevision
        - receiptDigest
        - occurredAt
      properties:
        transferPublicId:
          type: string
          format: uuid
        ownerModule:
          enum: [HRM, PER, TIM, PAY, SYS]
        transferKind:
          enum: [INGEST, EXPORT, DELIVERY, EXCHANGE]
        purposeCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        state:
          enum: [REQUESTED, SCANNING, READY, IN_PROGRESS, COMPLETED, QUARANTINED, FAILED, EXPIRED, CANCELLED]
        objectVersion:
          type: string
          minLength: 1
          maxLength: 128
        objectDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        byteSize:
          type: integer
          minimum: 1
          maximum: 5368709120
        mediaType:
          enum: [text/csv, application/json, application/pdf, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
        metadataSnapshotDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        egressPolicyRevision:
          type: [integer, 'null']
          minimum: 1
        receiptDigest:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        occurredAt:
          type: string
          format: date-time
    WorkplaceOccupancySignal:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - signalId
        - tenantKey
        - provider
        - deviceId
        - resourceCode
        - observedAt
        - receivedAt
        - state
        - confidence
      properties:
        schemaVersion:
          const: 1
        signalId:
          type: string
          maxLength: 160
        tenantKey:
          type: string
          maxLength: 80
        provider:
          type: string
          pattern: '^[A-Z][A-Z0-9_-]{1,39}$'
        deviceId:
          type: string
          maxLength: 160
        resourceCode:
          type: string
          maxLength: 80
        sequence:
          type: [integer, 'null']
          minimum: 0
        observedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        state:
          enum: [OCCUPIED, VACANT, UNKNOWN]
        confidence:
          type: number
          minimum: 0
          maximum: 1
