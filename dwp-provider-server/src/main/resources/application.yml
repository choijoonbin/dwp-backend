server:
  port: 8004

spring:
  application:
    name: dwp-provider-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PROVIDER_DB_NAME:dwp_provider}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  provider:
    service-token: ${DWP_PROVIDER_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.provider: ${LOG_LEVEL_PROVIDER:INFO}
