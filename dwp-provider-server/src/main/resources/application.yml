server:
  port: 8004

spring:
  application:
    name: dwp-provider-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PROVIDER_DB_NAME:dwp_provider}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  data-governance:
    cache-ttl: ${DWP_DATA_GOVERNANCE_CACHE_TTL:PT30S}
    query-timeout-seconds: ${DWP_DATA_GOVERNANCE_QUERY_TIMEOUT_SECONDS:10}
    sources:
      - key: auth
        database-name: ${AUTH_DB_NAME:dwp_auth}
        display-name: Identity & Access
        owner-service: dwp-auth-server
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${AUTH_DB_NAME:dwp_auth}
        username: ${DWP_METADATA_DB_USERNAME:${DB_USERNAME:dwp_user}}
        password: ${DWP_METADATA_DB_PASSWORD:${DB_PASSWORD:dwp_password}}
      - key: people
        database-name: ${PEOPLE_DB_NAME:dwp_people}
        display-name: People & Organization
        owner-service: dwp-people-server
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PEOPLE_DB_NAME:dwp_people}
        username: ${DWP_METADATA_DB_USERNAME:${DB_USERNAME:dwp_user}}
        password: ${DWP_METADATA_DB_PASSWORD:${DB_PASSWORD:dwp_password}}
      - key: platform
        database-name: ${PLATFORM_DB_NAME:dwp_platform}
        display-name: Workplace Platform
        owner-service: dwp-platform-server
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PLATFORM_DB_NAME:dwp_platform}
        username: ${DWP_METADATA_DB_USERNAME:${DB_USERNAME:dwp_user}}
        password: ${DWP_METADATA_DB_PASSWORD:${DB_PASSWORD:dwp_password}}
      - key: provider
        database-name: ${PROVIDER_DB_NAME:dwp_provider}
        display-name: Provider Control Plane
        owner-service: dwp-provider-server
        jdbc-url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PROVIDER_DB_NAME:dwp_provider}
        username: ${DWP_METADATA_DB_USERNAME:${DB_USERNAME:dwp_user}}
        password: ${DWP_METADATA_DB_PASSWORD:${DB_PASSWORD:dwp_password}}
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  provider:
    service-token: ${DWP_PROVIDER_SERVICE_TOKEN:}
    provisioning-token: ${DWP_PROVIDER_PROVISIONING_TOKEN:}
    support-validation-token: ${DWP_PROVIDER_SUPPORT_VALIDATION_TOKEN:}
    support-cookie-secure: ${DWP_PROVIDER_SUPPORT_COOKIE_SECURE:true}
  services:
    auth-url: ${SERVICE_AUTH_URL:http://localhost:8001}
    platform-url: ${SERVICE_PLATFORM_URL:http://localhost:8002}
    people-url: ${SERVICE_PEOPLE_URL:http://localhost:8003}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.provider: ${LOG_LEVEL_PROVIDER:INFO}
