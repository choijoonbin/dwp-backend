server:
  port: 8080

spring:
  application:
    name: dwp-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: auth-server
          uri: ${SERVICE_AUTH_URL:http://localhost:8001}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
              - ${CORS_ALLOWED_LOOPBACK_PATTERN:http://127.0.0.1:*}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - X-Correlation-ID
            allow-credentials: true
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
