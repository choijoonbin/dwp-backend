server:
  port: 8080

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: latest
      enable-auto-commit: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: scim-provisioning
              uri: ${SERVICE_AUTH_URL:http://localhost:8001}
              predicates:
                - Path=/scim/v2/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authServer
                    fallbackUri: forward:/_gateway/fallback
            - id: product-surface-contexts
              uri: forward:/_gateway/product-surface-contexts
              predicates:
                - Path=/api/auth/product-surface-contexts
                - Method=GET
            - id: product-surface-access-evaluation
              uri: forward:/_gateway/product-surface-access/evaluate
              predicates:
                - Path=/api/auth/product-surface-access/evaluate
                - Method=POST
            - id: governed-route-access-evaluation
              uri: forward:/_gateway/governed-route-access/evaluate
              predicates:
                - Path=/api/auth/governed-route-access/evaluate
                - Method=POST
            - id: assigned-access-review-detail
              uri: ${SERVICE_AUTH_URL:http://localhost:8001}
              predicates:
                - Path=/api/auth/work/access-review-items/{workItemRef}
                - Method=GET
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authServer
                    fallbackUri: forward:/_gateway/fallback
            - id: assigned-access-review-decision
              uri: ${SERVICE_AUTH_URL:http://localhost:8001}
              predicates:
                - Path=/api/auth/work/access-review-items/{workItemRef}/decision
                - Method=PUT
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authServer
                    fallbackUri: forward:/_gateway/fallback
            - id: auth-server
              uri: ${SERVICE_AUTH_URL:http://localhost:8001}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authServer
                    fallbackUri: forward:/_gateway/fallback
            - id: agent-runtime
              uri: ${SERVICE_AGENT_URL:http://localhost:8010}
              predicates:
                - Path=/api/agent/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: agentRuntime
                    fallbackUri: forward:/_gateway/fallback
            - id: platform-server
              uri: ${SERVICE_PLATFORM_URL:http://localhost:8002}
              predicates:
                - Path=/api/platform/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: platformServer
                    fallbackUri: forward:/_gateway/fallback
            - id: people-server
              uri: ${SERVICE_PEOPLE_URL:http://localhost:8003}
              predicates:
                - Path=/api/people/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: peopleServer
                    fallbackUri: forward:/_gateway/fallback
            - id: provider-server
              uri: ${SERVICE_PROVIDER_URL:http://localhost:8004}
              predicates:
                - Path=/api/provider/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 50
                    redis-rate-limiter.burstCapacity: 100
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: providerServer
                    fallbackUri: forward:/_gateway/fallback
            - id: approval-server
              uri: ${SERVICE_APPROVAL_URL:http://localhost:8005}
              predicates:
                - Path=/api/approvals/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: approvalServer
                    fallbackUri: forward:/_gateway/fallback
            - id: space-server
              uri: ${SERVICE_SPACE_URL:http://localhost:8006}
              predicates:
                - Path=/api/spaces/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: spaceServer
                    fallbackUri: forward:/_gateway/fallback
            - id: notification-stream
              uri: ${SERVICE_NOTIFICATION_URL:http://localhost:8008}
              predicates:
                - Path=/api/notifications/v1/stream
              filters:
                - StripPrefix=2
                - SetResponseHeader=X-Accel-Buffering, no
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: 4
                    key-resolver: "#{@enterpriseKeyResolver}"
            - id: notification-server
              uri: ${SERVICE_NOTIFICATION_URL:http://localhost:8008}
              predicates:
                - Path=/api/notifications/v1/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100
                    redis-rate-limiter.burstCapacity: 200
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: notificationServer
                    fallbackUri: forward:/_gateway/fallback
            - id: messaging-server
              uri: ${SERVICE_MESSAGING_URL:http://localhost:8007}
              predicates:
                - Path=/api/messaging/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 140
                    redis-rate-limiter.burstCapacity: 280
                    key-resolver: "#{@enterpriseKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: messagingServer
                    fallbackUri: forward:/_gateway/fallback
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
                  - ${CORS_ALLOWED_LOOPBACK_PATTERN:http://127.0.0.1:*}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - '*'
                exposed-headers:
                  - X-Correlation-ID
                allow-credentials: true
                max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      agentRuntime:
        base-config: default
        slow-call-duration-threshold: ${DWP_AGENT_SLOW_CALL_THRESHOLD:30s}
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: true
    instances:
      agentRuntime:
        timeout-duration: ${DWP_AGENT_GATEWAY_TIMEOUT:45s}
        cancel-running-future: true

dwp:
  gateway:
    product-surface-rollout:
      invalidation-enabled: ${DWP_PRODUCT_SURFACE_ROLLOUT_INVALIDATION_ENABLED:false}
      invalidation-topic: ${DWP_PRODUCT_SURFACE_ROLLOUT_INVALIDATION_TOPIC:dwp.feature-rollout.decision.changed.v1}
      invalidation-group-id: ${DWP_PRODUCT_SURFACE_ROLLOUT_INVALIDATION_GROUP_ID:dwp-gateway-product-surface-rollout}
  auth:
    product-surface-token: ${DWP_PRODUCT_SURFACE_TOKEN:}
  product-surface:
    authority-timeout: ${DWP_PRODUCT_SURFACE_AUTHORITY_TIMEOUT:2s}
    eligibility-timeout: ${DWP_PRODUCT_SURFACE_ELIGIBILITY_TIMEOUT:2s}
    rollout-evaluation-timeout: ${DWP_PRODUCT_SURFACE_ROLLOUT_TIMEOUT:2s}
    rollout-latch-timeout: ${DWP_PRODUCT_SURFACE_ROLLOUT_LATCH_TIMEOUT:1s}
    rollout-cache-ttl: ${DWP_PRODUCT_SURFACE_ROLLOUT_CACHE_TTL:60s}
    rollout-cache-max-entries: ${DWP_PRODUCT_SURFACE_ROLLOUT_CACHE_MAX_ENTRIES:10000}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  agent:
    service-token: ${DWP_AGENT_SERVICE_TOKEN:}
  platform:
    service-token: ${DWP_PLATFORM_SERVICE_TOKEN:}
  people:
    service-token: ${DWP_PEOPLE_SERVICE_TOKEN:}
  provider:
    service-token: ${DWP_PROVIDER_SERVICE_TOKEN:}
    support-validation-token: ${DWP_PROVIDER_SUPPORT_VALIDATION_TOKEN:}
    support-validation-timeout: ${DWP_PROVIDER_SUPPORT_VALIDATION_TIMEOUT:2s}
  approval:
    service-token: ${DWP_APPROVAL_SERVICE_TOKEN:}
  space:
    service-token: ${DWP_SPACE_SERVICE_TOKEN:}
  notification:
    service-token: ${DWP_NOTIFICATION_SERVICE_TOKEN:}
  messaging:
    service-token: ${DWP_MESSAGING_SERVICE_TOKEN:}
