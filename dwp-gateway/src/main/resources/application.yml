server:
  port: 8080

spring:
  application:
    name: dwp-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: scim-provisioning
          uri: ${SERVICE_AUTH_URL:http://localhost:8001}
          predicates:
            - Path=/scim/v2/**
        - id: auth-server
          uri: ${SERVICE_AUTH_URL:http://localhost:8001}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: agent-runtime
          uri: ${SERVICE_AGENT_URL:http://localhost:8010}
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=2
        - id: platform-server
          uri: ${SERVICE_PLATFORM_URL:http://localhost:8002}
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=2
        - id: people-server
          uri: ${SERVICE_PEOPLE_URL:http://localhost:8003}
          predicates:
            - Path=/api/people/**
          filters:
            - StripPrefix=2
        - id: provider-server
          uri: ${SERVICE_PROVIDER_URL:http://localhost:8004}
          predicates:
            - Path=/api/provider/**
          filters:
            - StripPrefix=2
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - ${CORS_ALLOWED_ORIGIN_PATTERN:http://localhost:*}
              - ${CORS_ALLOWED_LOOPBACK_PATTERN:http://127.0.0.1:*}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - X-Correlation-ID
            allow-credentials: true
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}

dwp:
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  agent:
    service-token: ${DWP_AGENT_SERVICE_TOKEN:}
  platform:
    service-token: ${DWP_PLATFORM_SERVICE_TOKEN:}
  people:
    service-token: ${DWP_PEOPLE_SERVICE_TOKEN:}
  provider:
    service-token: ${DWP_PROVIDER_SERVICE_TOKEN:}
