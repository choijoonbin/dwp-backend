server:
  port: 8008

spring:
  application:
    name: dwp-notification-server
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:dwp_notification}
    username: ${NOTIFICATION_DB_USERNAME:dwp_notification_runtime}
    password: ${NOTIFICATION_DB_PASSWORD:dwp_notification_runtime_password}
    hikari:
      maximum-pool-size: ${DWP_NOTIFICATION_DB_POOL_SIZE:20}
      auto-commit: false
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${NOTIFICATION_DB_NAME:dwp_notification}
    user: ${NOTIFICATION_MIGRATION_DB_USERNAME:${DB_USERNAME:dwp_user}}
    password: ${NOTIFICATION_MIGRATION_DB_PASSWORD:${DB_PASSWORD:dwp_password}}
    locations: ${DWP_NOTIFICATION_FLYWAY_LOCATIONS:classpath:db/migration}
    placeholders:
      notificationRuntimeRole: ${NOTIFICATION_DB_USERNAME:dwp_notification_runtime}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  mvc:
    async:
      request-timeout: ${DWP_NOTIFICATION_SSE_TIMEOUT:30m}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: ${DWP_NOTIFICATION_KAFKA_MAX_BLOCK_MS:5000}
    listener:
      ack-mode: record
      missing-topics-fatal: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${DWP_NOTIFICATION_REDIS_SSL_ENABLED:false}
      timeout: ${DWP_NOTIFICATION_REDIS_TIMEOUT:2s}
      connect-timeout: ${DWP_NOTIFICATION_REDIS_CONNECT_TIMEOUT:2s}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}
  paths-to-match: /v1/**
  paths-to-exclude: /internal/**

dwp:
  audit:
    relay-database-role: dwp_notification_audit_relay
  notification:
    bulk-undo-window: ${DWP_NOTIFICATION_BULK_UNDO_WINDOW:PT10M}
    service-token: ${DWP_NOTIFICATION_SERVICE_TOKEN:}
    gateway-source: ${DWP_NOTIFICATION_GATEWAY_SOURCE:dwp-gateway}
    producer-tokens: ${DWP_NOTIFICATION_PRODUCER_TOKENS:}
    producer-app-bindings: >-
      ${DWP_NOTIFICATION_PRODUCER_APP_BINDINGS:dwp-approval-server=approvals,dwp-people-server=hcm|people,dwp-platform-server=platform,dwp-space-server=space,dwp-messaging-server=messaging}
    cursor-secret: ${DWP_NOTIFICATION_CURSOR_SECRET:}
    cursor-ttl: ${DWP_NOTIFICATION_CURSOR_TTL:24h}
    sse-timeout: ${DWP_NOTIFICATION_SSE_TIMEOUT:30m}
    sse-heartbeat: ${DWP_NOTIFICATION_SSE_HEARTBEAT:15s}
    sse-max-connections: ${DWP_NOTIFICATION_SSE_MAX_CONNECTIONS:5000}
    sse-max-connections-per-tenant: ${DWP_NOTIFICATION_SSE_MAX_CONNECTIONS_PER_TENANT:1000}
    sse-max-connections-per-user: ${DWP_NOTIFICATION_SSE_MAX_CONNECTIONS_PER_USER:4}
    sse-catch-up-buffer-capacity: ${DWP_NOTIFICATION_SSE_CATCH_UP_BUFFER_CAPACITY:100}
    realtime:
      redis-enabled: ${DWP_NOTIFICATION_REDIS_ENABLED:true}
      channel-prefix: ${DWP_NOTIFICATION_REDIS_CHANNEL_PREFIX:dwp.notification.signal.v1}
      shard-count: ${DWP_NOTIFICATION_REDIS_SHARD_COUNT:32}
    admission:
      window: ${DWP_NOTIFICATION_ADMISSION_WINDOW:PT1H}
    retention:
      enabled: ${DWP_NOTIFICATION_RETENTION_ENABLED:true}
      default-ttl: ${DWP_NOTIFICATION_DEFAULT_RETENTION_TTL:P0D}
      admission-receipt-ttl: ${DWP_NOTIFICATION_ADMISSION_RECEIPT_TTL:P7D}
      batch-size: ${DWP_NOTIFICATION_RETENTION_BATCH_SIZE:100}
      fixed-delay: ${DWP_NOTIFICATION_RETENTION_FIXED_DELAY:5m}
      initial-delay: ${DWP_NOTIFICATION_RETENTION_INITIAL_DELAY:1m}
    reconciliation:
      enabled: ${DWP_NOTIFICATION_RECONCILIATION_ENABLED:true}
      batch-size: ${DWP_NOTIFICATION_RECONCILIATION_BATCH_SIZE:100}
      fixed-delay: ${DWP_NOTIFICATION_RECONCILIATION_FIXED_DELAY:5m}
      initial-delay: ${DWP_NOTIFICATION_RECONCILIATION_INITIAL_DELAY:2m}
    outbox:
      enabled: ${DWP_NOTIFICATION_OUTBOX_RELAY_ENABLED:true}
      provision-topic: ${DWP_NOTIFICATION_OUTBOX_PROVISION_TOPIC:false}
      topic: ${DWP_NOTIFICATION_OUTBOX_TOPIC:dwp.notification.outbox.v1}
      partitions: ${DWP_NOTIFICATION_OUTBOX_PARTITIONS:6}
      replication-factor: ${DWP_NOTIFICATION_OUTBOX_REPLICATION_FACTOR:1}
      topic-retention-ms: ${DWP_NOTIFICATION_OUTBOX_TOPIC_RETENTION_MS:604800000}
      instance-id: ${DWP_NOTIFICATION_INSTANCE_ID:${HOSTNAME:local}}
      lease-duration: ${DWP_NOTIFICATION_OUTBOX_LEASE_DURATION:PT30S}
      send-timeout: ${DWP_NOTIFICATION_OUTBOX_SEND_TIMEOUT:PT5S}
      published-retention: ${DWP_NOTIFICATION_OUTBOX_PUBLISHED_RETENTION:P7D}
      maximum-attempts: ${DWP_NOTIFICATION_OUTBOX_MAXIMUM_ATTEMPTS:12}
      batch-size: ${DWP_NOTIFICATION_OUTBOX_BATCH_SIZE:50}
      fixed-delay: ${DWP_NOTIFICATION_OUTBOX_FIXED_DELAY:1s}
      initial-delay: ${DWP_NOTIFICATION_OUTBOX_INITIAL_DELAY:5s}
    allowed-producers: ${DWP_NOTIFICATION_ALLOWED_PRODUCERS:dwp-approval-server,dwp-people-server,dwp-platform-server,dwp-space-server,dwp-messaging-server}
    domain-events:
      enabled: ${DWP_NOTIFICATION_DOMAIN_EVENTS_ENABLED:false}
      topic: ${DWP_DOMAIN_EVENT_TOPIC:dwp.domain-events.v1}
      group-id: ${DWP_NOTIFICATION_DOMAIN_EVENT_GROUP_ID:dwp-notification-domain-events-v1}
      dead-letter-topic: ${DWP_NOTIFICATION_DOMAIN_EVENT_DLT:dwp.domain-events.v1.DLT}
      retry-interval: ${DWP_NOTIFICATION_DOMAIN_EVENT_RETRY_INTERVAL:1s}
      maximum-attempts: ${DWP_NOTIFICATION_DOMAIN_EVENT_MAX_ATTEMPTS:4}
      producer-sources: ${DWP_NOTIFICATION_DOMAIN_EVENT_SOURCES:urn:dwp:messaging=dwp-messaging-server}
    approval-pilot:
      enabled: ${DWP_NOTIFICATION_APPROVAL_PILOT_ENABLED:false}
      topic: ${DWP_NOTIFICATION_APPROVAL_PILOT_TOPIC:dwp.approval.events.v1}
      group-id: ${DWP_NOTIFICATION_APPROVAL_PILOT_GROUP_ID:dwp-notification-approval-pilot-v1}
      dead-letter-topic: ${DWP_NOTIFICATION_APPROVAL_PILOT_DLT:dwp.approval.events.v1.DLT}
      retry-interval: ${DWP_NOTIFICATION_APPROVAL_PILOT_RETRY_INTERVAL:1s}
      maximum-attempts: ${DWP_NOTIFICATION_APPROVAL_PILOT_MAX_ATTEMPTS:4}
      allowed-event-types: ${DWP_NOTIFICATION_APPROVAL_PILOT_EVENT_TYPES:approval.task.assigned,approval.request.submitted,approval.request.approved,approval.request.rejected}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.notification: ${LOG_LEVEL_NOTIFICATION:INFO}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/local-seed
dwp:
  notification:
    domain-events:
      enabled: true
    outbox:
      provision-topic: true
