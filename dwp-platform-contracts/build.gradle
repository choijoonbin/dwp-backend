// Provider-neutral platform ports used by R0 contract spikes and R1 domain services.

jar {
    enabled = true
}

bootJar {
    enabled = false
}

processResources {
    from(rootProject.file('contracts/hris/canonical')) {
        into 'META-INF/dwp/hris/canonical'
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
    inputs.file(rootProject.file('contracts/asyncapi/domain-events.yaml'))
            .withPropertyName('domainEventsAsyncApi')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file(
            'contracts/hris/canonical/schemas/cross-module-canonical-schemas.v1.json'))
            .withPropertyName('hrisCanonicalSchemas')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
