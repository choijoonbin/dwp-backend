server:
  port: 8085
  # SSE 스트림: 기본 10초 async timeout 방지 — SseEmitter 30분과 동일
  servlet:
    async:
      request-timeout: 1800000   # 30 min (ms)
  # Tomcat: 장시간 스트리밍 시 연결 유지
  tomcat:
    connection-timeout: 60000    # 60s (첫 요청 수락)
    keep-alive-timeout: 300000   # 5 min (유휴 시 keep-alive 유지, -1=무제한은 비권장)
    max-keep-alive-requests: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized

spring:
  application:
    name: synapsex-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dwp_aura}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dwp_aura
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dwp_aura
    default-schema: dwp_aura
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  # Redis (Aura audit 이벤트 수신용 - HITL과 동일 인스턴스)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# auth-server URL (Team Snapshot display_name Feign 호출용)
auth:
  server:
    url: ${SERVICE_AUTH_URL:http://localhost:8001}

# RAG 업로드 원본 파일 보관 (S3 / 로컬)
storage:
  # 로컬 환경: 파일 시스템 경로. 서버 기동 시 없으면 자동 생성.
  # 기본값: 프로세스 CWD 기준 상대 경로 (로컬/개발 환경). 운영은 RAG_STORAGE_LOCAL_PATH 로 절대 경로 지정.
  local:
    path: ${RAG_STORAGE_LOCAL_PATH:./storage/rag-documents}
  rag:
    type: ${RAG_STORAGE_TYPE:local}
    s3:
      bucket: ${RAG_UPLOAD_BUCKET:dwp-rag-uploads}
      region: ${AWS_REGION:ap-northeast-2}
      prefix: ${RAG_UPLOAD_PREFIX:rag/documents}

# Aura Platform URL (Case 탭 프록시용 - analysis/confidence/similar/rag/evidence)
aura:
  base-url: ${AURA_BASE_URL:${AURA_PLATFORM_URL:http://localhost:9000}}
  # Phase3 트리거: 설정 시 POST /aura/internal/.../analysis-runs + callbacks 사용
  phase3:
    callback-base-url: ${AURA_PHASE3_CALLBACK_BASE_URL:}  # e.g. https://gateway/api/synapse/internal/aura/callback
    callback-auth-token: ${AURA_PHASE3_CALLBACK_AUTH_TOKEN:}
  # 조치 완료 웹훅 (선택) — URL 설정 시 POST로 동일 payload 전송
  webhook:
    action-completed-url: ${AURA_ACTION_COMPLETED_WEBHOOK_URL:}

# P1.1: 탭 Non-Empty 검증용 DEMO 모드 (기본 OFF)
# stream-url-use-aura-direct: true 시 POST analysis-runs 응답 streamUrl이 Aura 절대 URL (개발/로컬용). 기본 false = BE 프록시 경로 (옵션 B)
synapse:
  demo-mode: ${SYNAPSE_DEMO_MODE:false}
  stream-url-use-aura-direct: ${SYNAPSE_STREAM_URL_USE_AURA_DIRECT:false}

# Audit Redis (Aura 이벤트 수신)
audit:
  redis:
    enabled: ${AUDIT_REDIS_ENABLED:true}
    channel: ${AUDIT_REDIS_CHANNEL:audit:events:ingest}

# Phase 6: 워크벤치 조치 완료 Redis Pub/Sub (Aura 규격과 채널 통일: workbench:case:action)
workbench:
  redis:
    action-channel: ${WORKBENCH_ACTION_CHANNEL:workbench:case:action}
  # case_created 발행 후 analysis_started 트리거까지 지연(ms). FE 리스트 렌더링 후 분석 중 상태 도달하도록 기본 600ms.
  analysis-trigger-delay-ms: ${WORKBENCH_ANALYSIS_TRIGGER_DELAY_MS:600}

# Real-time Notification Bridge (WebSocket + Redis)
notification:
  redis:
    enabled: ${NOTIFICATION_REDIS_ENABLED:true}
    workbench-pattern: ${NOTIFICATION_REDIS_WORKBENCH_PATTERN:workbench:*}
  websocket:
    allowed-origins: ${NOTIFICATION_WS_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}}
    # SockJS 유휴 세션 유지 시간(ms). 기본 30분. 이 시간 동안 메시지 없으면 세션 종료.
    disconnect-delay-ms: ${NOTIFICATION_WS_DISCONNECT_DELAY_MS:1800000}

# Phase B: Detect 배치 (기본 비활성 - 수동 트리거만)
detect:
  batch:
    enabled: ${DETECT_BATCH_ENABLED:false}
    cron: ${DETECT_BATCH_CRON:0 */15 * * * *}
    interval-minutes: ${DETECT_BATCH_INTERVAL_MINUTES:15}

feign:
  client:
    config:
      aura-case-tab:
        connectTimeout: 3000
        readTimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    "[com.dwp.services.synapsex]": DEBUG
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_PARAMETER_LOG_LEVEL:WARN}
