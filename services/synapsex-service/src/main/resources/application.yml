server:
  port: 8085
  # SSE 스트림: 기본 10초 async timeout 방지 — SseEmitter 30분과 동일
  servlet:
    async:
      request-timeout: 1800000   # 30 min (ms)
  # Tomcat: 장시간 스트리밍 시 연결 유지
  tomcat:
    connection-timeout: 60000    # 60s (첫 요청 수락)
    keep-alive-timeout: 300000   # 5 min (유휴 시 keep-alive 유지, -1=무제한은 비권장)
    max-keep-alive-requests: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized

spring:
  application:
    name: synapsex-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dwp_aura}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: dwp_aura
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: dwp_aura
    default-schema: dwp_aura
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
  # Redis (Aura audit 이벤트 수신용 - HITL과 동일 인스턴스)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# auth-server URL (Team Snapshot display_name Feign 호출용)
auth:
  server:
    url: ${SERVICE_AUTH_URL:http://localhost:8001}

# Aura Platform URL (Case 탭 프록시용 - analysis/confidence/similar/rag/evidence)
aura:
  base-url: ${AURA_BASE_URL:${AURA_PLATFORM_URL:http://localhost:9000}}
  # Phase3 트리거: 설정 시 POST /aura/internal/.../analysis-runs + callbacks 사용
  phase3:
    callback-base-url: ${AURA_PHASE3_CALLBACK_BASE_URL:}  # e.g. https://gateway/api/synapse/internal/aura/callback
    callback-auth-token: ${AURA_PHASE3_CALLBACK_AUTH_TOKEN:}

# P1.1: 탭 Non-Empty 검증용 DEMO 모드 (기본 OFF)
# stream-url-use-aura-direct: true 시 POST analysis-runs 응답 streamUrl이 Aura 절대 URL (개발/로컬용). 기본 false = BE 프록시 경로 (옵션 B)
synapse:
  demo-mode: ${SYNAPSE_DEMO_MODE:false}
  stream-url-use-aura-direct: ${SYNAPSE_STREAM_URL_USE_AURA_DIRECT:false}

# Audit Redis (Aura 이벤트 수신)
audit:
  redis:
    enabled: ${AUDIT_REDIS_ENABLED:true}
    channel: ${AUDIT_REDIS_CHANNEL:audit:events:ingest}

# Phase B: Detect 배치 (기본 비활성 - 수동 트리거만)
detect:
  batch:
    enabled: ${DETECT_BATCH_ENABLED:false}
    cron: ${DETECT_BATCH_CRON:0 */15 * * * *}
    interval-minutes: ${DETECT_BATCH_INTERVAL_MINUTES:15}

feign:
  client:
    config:
      aura-case-tab:
        connectTimeout: 3000
        readTimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    "[com.dwp.services.synapsex]": DEBUG
