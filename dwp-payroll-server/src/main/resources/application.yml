server:
  port: ${DWP_PAYROLL_SERVER_PORT:8012}
  shutdown: graceful

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

payroll:
  projection-publisher:
    username: ${PAYROLL_PROJECTION_PUBLISHER_DB_USERNAME:dwp_payroll_projection_publisher}

spring:
  application:
    name: dwp-payroll-server
  lifecycle:
    timeout-per-shutdown-phase: ${DWP_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYROLL_DB_NAME:dwp_payroll}
    username: ${PAYROLL_DB_USERNAME:dwp_payroll_runtime}
    password: ${PAYROLL_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET search_path TO pg_catalog, public
      maximum-pool-size: ${DWP_PAYROLL_DB_POOL_SIZE:20}
      auto-commit: false
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${PAYROLL_DB_NAME:dwp_payroll}
    user: ${PAYROLL_MIGRATION_DB_USERNAME:}
    password: ${PAYROLL_MIGRATION_DB_PASSWORD:}
    locations: ${DWP_PAYROLL_FLYWAY_LOCATIONS:classpath:db/migration}
    default-schema: public
    schemas:
      - public
    table: flyway_schema_history
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    fail-on-missing-locations: true
    create-schemas: false
    placeholder-replacement: true
    clean-on-validation-error: false
    group: false
    mixed: false
    skip-default-callbacks: false
    skip-default-resolvers: false
    validate-migration-naming: true
    execute-in-transaction: true
    output-query-results: false
    community-db-support-enabled: false
    skip-executing-migrations: false
    ignore-migration-patterns: []
    connect-retries: 3
    lock-retry-count: 10
    placeholders:
      payrollRuntimeRole: ${PAYROLL_DB_USERNAME:dwp_payroll_runtime}
      payrollProjectionPublisherRole: ${payroll.projection-publisher.username}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false

dwp:
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  payroll:
    hrm013-task-dispatch:
      # BASE-TFR-HRM-013 remains dark until V56, an external workload
      # credential source, Auth resolver trust and tenant activation are
      # independently approved. No local/dev credential fallback exists.
      enabled: ${DWP_PAYROLL_HRM013_TASK_DISPATCH_ENABLED:false}
      auth-url: ${DWP_PAYROLL_HRM013_AUTH_URL:}
      people-url: ${DWP_PAYROLL_HRM013_PEOPLE_URL:}
      relay-delay-ms: ${DWP_PAYROLL_HRM013_RELAY_DELAY_MS:2000}
      relay-initial-delay-ms: ${DWP_PAYROLL_HRM013_RELAY_INITIAL_DELAY_MS:5000}
      relay-lease-seconds: ${DWP_PAYROLL_HRM013_RELAY_LEASE_SECONDS:30}
      relay-max-attempts: ${DWP_PAYROLL_HRM013_RELAY_MAX_ATTEMPTS:10}
      relay-max-claims-per-poll: ${DWP_PAYROLL_HRM013_RELAY_MAX_CLAIMS_PER_POLL:8}
  hris:
    payroll:
      home-producer:
        # PAY-015 remains dark until the Platform workload trust, current owner
        # authority adapter, replay ledger and tenant activation are installed.
        enabled: ${DWP_HRIS_PAYROLL_HOME_PRODUCER_ENABLED:false}
        event-publication-enabled: ${DWP_HRIS_PAYROLL_HOME_EVENT_PUBLICATION_ENABLED:false}
        publication-delay-ms: ${DWP_HRIS_PAYROLL_HOME_PUBLICATION_DELAY_MS:1000}
        payload-reference-secret: ${DWP_HRIS_PAYROLL_HOME_PAYLOAD_REFERENCE_SECRET:}
        signing-key-id: ${DWP_HRIS_PAYROLL_HOME_SIGNING_KEY_ID:}
        signing-public-key-pem: ${DWP_HRIS_PAYROLL_HOME_SIGNING_PUBLIC_KEY_PEM:}
        workload-authentication: ${DWP_HRIS_PAYROLL_HOME_WORKLOAD_AUTHENTICATION:CLIENT_CREDENTIAL_JWT}
        fresh-for: ${DWP_HRIS_PAYROLL_HOME_FRESH_FOR:PT2M}
        stale-after: ${DWP_HRIS_PAYROLL_HOME_STALE_AFTER:PT10M}
      calculation:
        # BASE-TFR-PAY-011 is delivered dark. Activation requires a separate
        # control decision after V51 and the owner-runtime evidence are accepted.
        enabled: ${DWP_HRIS_PAYROLL_CALCULATION_ENABLED:false}
        worker:
          tenant-ids: ${DWP_HRIS_PAYROLL_CALCULATION_TENANT_IDS:}
          poll-delay: ${DWP_HRIS_PAYROLL_CALCULATION_POLL_DELAY:PT2S}
          initial-delay: ${DWP_HRIS_PAYROLL_CALCULATION_INITIAL_DELAY:PT5S}
          max-claims-per-poll: ${DWP_HRIS_PAYROLL_CALCULATION_MAX_CLAIMS_PER_POLL:8}
          lease-duration: ${DWP_HRIS_PAYROLL_CALCULATION_LEASE_DURATION:PT30S}
          checkpoint-size: ${DWP_HRIS_PAYROLL_CALCULATION_CHECKPOINT_SIZE:100}
          max-inputs-per-claim: ${DWP_HRIS_PAYROLL_CALCULATION_MAX_INPUTS_PER_CLAIM:1000}
    payroll-compensation-plan-input:
      # PAY-016 stays dark until V49, Kafka ACLs, and the exact People workload
      # identity are installed together. Enabling with incomplete trust material
      # fails startup instead of falling back to a browser or shared service token.
      enabled: ${DWP_HRIS_PAYROLL_COMPENSATION_PLAN_INPUT_ENABLED:false}
      consumer-group: ${DWP_HRIS_PAYROLL_COMPENSATION_PLAN_INPUT_CONSUMER_GROUP:dwp-payroll-compensation-plan-input-v1}
      broker:
        retry-delay: ${DWP_HRIS_PAYROLL_COMPENSATION_PLAN_INPUT_RETRY_DELAY:PT2S}
        retry-attempts: ${DWP_HRIS_PAYROLL_COMPENSATION_PLAN_INPUT_RETRY_ATTEMPTS:5}
      owner-refetch:
        base-url: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_BASE_URL:}
        issuer: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_JWT_ISSUER:}
        private-jwk: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_PRIVATE_JWK:}
        tenant-grants: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_TENANT_GRANTS:}
        key-store: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_KEY_STORE:}
        key-store-password: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_KEY_STORE_PASSWORD:}
        key-password: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_KEY_PASSWORD:}
        trust-store: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_TRUST_STORE:}
        trust-store-password: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_TRUST_STORE_PASSWORD:}
        connect-timeout: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_CONNECT_TIMEOUT:PT2S}
        read-timeout: ${DWP_HRIS_PAYROLL_COMPENSATION_OWNER_READ_TIMEOUT:PT30S}
    payroll-foundation:
      wave1:
        enabled: ${DWP_HRIS_PAYROLL_FOUNDATION_WAVE1_ENABLED:false}
      settings:
        enabled: ${DWP_HRIS_PAYROLL_FOUNDATION_SETTINGS_ENABLED:false}
      synthetic-bootstrap:
        enabled: ${DWP_LOCAL_SYNTHETIC_PAYROLL_FOUNDATION_BOOTSTRAP_ENABLED:false}
        token: ${DWP_LOCAL_SYNTHETIC_PAYROLL_FOUNDATION_BOOTSTRAP_TOKEN:}
        run-id: ${DWP_LOCAL_SYNTHETIC_PAYROLL_FOUNDATION_BOOTSTRAP_RUN_ID:}
  payroll:
    database:
      adoption-receipt-sha256: ${DWP_PAYROLL_ADOPTION_RECEIPT_SHA256:}
      adoption-control-reference: ${DWP_PAYROLL_ADOPTION_CONTROL_REFERENCE:}
      control-run-receipt-json: ${DWP_PAYROLL_MIGRATION_CONTROL_RUN_RECEIPT_JSON:}
      control-run-receipt-sha256: ${DWP_PAYROLL_MIGRATION_CONTROL_RUN_RECEIPT_SHA256:}
      migration-control-reference: ${DWP_PAYROLL_MIGRATION_CONTROL_REFERENCE:}
    service-token: ${DWP_PAYROLL_SERVICE_TOKEN:}
    product-authorization-enabled: ${DWP_PAYROLL_PRODUCT_AUTHORIZATION_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.payroll: ${LOG_LEVEL_PAYROLL:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    configs:
      idempotent:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
