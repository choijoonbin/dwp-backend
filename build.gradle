plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.cyclonedx.bom' version '3.3.0'
}

allprojects {
    group = 'com.dwp'
    version = '1.0.0'
    
    repositories {
        mavenCentral()
    }
}

tasks.register('checkServiceBoundaries', Exec) {
    workingDir rootDir
    commandLine 'python3', 'scripts/check-service-boundaries.py'
}

tasks.register('checkSourceSize', Exec) {
    workingDir rootDir
    commandLine 'python3', 'scripts/check-source-size.py'
}

tasks.named('check') {
    dependsOn tasks.named('checkServiceBoundaries')
    dependsOn tasks.named('checkSourceSize')
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    ext['flyway.version'] = '12.11.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs += ['-parameters', '-Xlint:all', '-Xlint:-processing']
    }
    
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }
    
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
            mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.30.0'
        }
    }
    
    tasks.named('test') {
        useJUnitPlatform()
    }
}
