plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.cyclonedx.bom' version '3.3.0'
}

allprojects {
    group = 'com.dwp'
    version = '1.0.0'
    
    repositories {
        mavenCentral()
    }
}

tasks.register('checkServiceBoundaries', Exec) {
    dependsOn 'serviceBoundaryRatchetTest'
    workingDir rootDir
    commandLine 'python3', 'scripts/check-service-boundaries.py'
}

tasks.register('serviceBoundaryRatchetTest', Exec) {
    group = 'verification'
    description = 'Runs fail-closed service and application-layer boundary regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_service_boundaries.py', '-v'
}

tasks.register('checkSourceSize', Exec) {
    dependsOn 'sourceSizeRatchetTest'
    workingDir rootDir
    commandLine 'python3', 'scripts/check-source-size.py'
}

tasks.register('sourceSizeRatchetTest', Exec) {
    group = 'verification'
    description = 'Runs source-size exact-ratchet and fail-closed baseline regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_source_size.py', '-v'
}

tasks.register('checkTestSourceSize', Exec) {
    dependsOn 'testSourceSizeRatchetTest'
    group = 'verification'
    description = 'Checks exact line-count ratchets for oversized Java test files.'
    workingDir rootDir
    commandLine 'python3', 'scripts/check-test-source-size.py'
}

tasks.register('testSourceSizeRatchetTest', Exec) {
    group = 'verification'
    description = 'Runs fail-closed Java test source-size baseline regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_test_source_size.py', '-v'
}

tasks.register('checkJavaDependencyCycles', Exec) {
    dependsOn 'javaDependencyCycleRatchetTest'
    group = 'verification'
    description = 'Rejects new or changed Java SCCs and every Spring constructor cycle.'
    workingDir rootDir
    commandLine 'python3', 'scripts/check-java-dependency-cycles.py'
}

tasks.register('javaDependencyCycleRatchetTest', Exec) {
    group = 'verification'
    description = 'Runs exact SCC baseline and fail-closed Spring cycle regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_java_dependency_cycles.py', '-v'
}

tasks.register('checkUnusedPrivateMethods', Exec) {
    dependsOn 'unusedPrivateMethodRatchetTest'
    group = 'verification'
    description = 'Rejects trivially unreachable unannotated private Java methods.'
    workingDir rootDir
    commandLine 'python3', 'scripts/check-unused-private-methods.py'
}

tasks.register('unusedPrivateMethodRatchetTest', Exec) {
    group = 'verification'
    description = 'Runs unused-private-method fail-closed scanner regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_unused_private_methods.py', '-v'
}

tasks.register('productAuthorizationRegistryGenerate', Exec) {
    group = 'build setup'
    description = 'Generates deterministic CORE-006 authorization registry artifacts.'
    workingDir rootDir
    commandLine 'python3', 'scripts/generate-product-authorization-contracts.py'
}

tasks.register('productAuthorizationRegistryCheck', Exec) {
    group = 'verification'
    description = 'Verifies checked-in CORE-006 authorization registry artifacts.'
    workingDir rootDir
    commandLine 'python3', 'scripts/generate-product-authorization-contracts.py', '--check'
}

tasks.register('approvalProjectionSchemaCheck', Exec) {
    group = 'verification'
    description = 'Verifies v2 Approval-gate field-mask schema hashes against raw OpenAPI components.'
    dependsOn tasks.named('productAuthorizationRegistryCheck')
    workingDir rootDir
    commandLine 'python3', 'scripts/check-approval-projection-schemas.py'
}

tasks.register('pilotFixturesGenerate', Exec) {
    group = 'build setup'
    description = 'Generates deterministic CORE-006 pilot authorization fixtures.'
    workingDir rootDir
    commandLine 'python3', 'scripts/generate-product-authorization-fixtures.py', '--write'
}

tasks.register('pilotFixturesCheck', Exec) {
    group = 'verification'
    description = 'Verifies checked-in CORE-006 pilot authorization fixtures.'
    workingDir rootDir
    commandLine 'python3', 'scripts/generate-product-authorization-fixtures.py', '--check'
}

tasks.register('authorizationNegativeMatrixCheck', Exec) {
    group = 'verification'
    description = 'Verifies the fail-closed X-03 product authorization negative-test inventory.'
    dependsOn tasks.named('authorizationNegativeMatrixTest')
    workingDir rootDir
    commandLine 'python3', 'scripts/check-authorization-negative-matrix.py'
}

tasks.register('authorizationNegativeMatrixTest', Exec) {
    group = 'verification'
    description = 'Runs X-03 owner-service routing and evidence-boundary regressions.'
    workingDir rootDir
    commandLine 'python3', '-m', 'unittest', 'discover',
            '-s', 'scripts/tests', '-p', 'test_authorization_negative_matrix.py', '-v'
}

tasks.named('check') {
    dependsOn tasks.named('checkServiceBoundaries')
    dependsOn tasks.named('checkSourceSize')
    dependsOn tasks.named('checkTestSourceSize')
    dependsOn tasks.named('checkJavaDependencyCycles')
    dependsOn tasks.named('checkUnusedPrivateMethods')
    dependsOn tasks.named('productAuthorizationRegistryCheck')
    dependsOn tasks.named('approvalProjectionSchemaCheck')
    dependsOn tasks.named('pilotFixturesCheck')
    dependsOn tasks.named('authorizationNegativeMatrixCheck')
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    ext['flyway.version'] = '12.11.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs += ['-parameters', '-Xlint:all', '-Xlint:-processing']
    }
    
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }
    
    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.3'
            mavenBom 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.30.0'
        }
    }
    
    tasks.named('test') {
        useJUnitPlatform()
    }

    if (name in [
            'dwp-auth-server',
            'dwp-gateway',
            'dwp-platform-server',
            'dwp-provider-server',
            'dwp-approval-server',
            'dwp-people-server']) {
        tasks.named('processTestResources') {
            from(rootProject.file(
                    'contracts/product-authorization/pilot-fixtures.v1.generated.json')) {
                into 'product-authorization'
            }
            from(rootProject.file(
                    'contracts/product-authorization/'
                            + 'pilot-test-registry-overrides.v1.generated.json')) {
                into 'product-authorization'
            }
        }
        tasks.named('test') {
            dependsOn rootProject.tasks.named('pilotFixturesCheck')
        }
    }
}
