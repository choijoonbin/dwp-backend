name: Backend quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dwp-dev

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Run backend quality gates
        run: ./gradlew --no-daemon check

      - name: Generate aggregate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom

      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-cyclonedx-sbom
          path: build/reports/cyclonedx/
          if-no-files-found: error
          retention-days: 30

      - name: Validate migrations and code contracts
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            python3 scripts/devctl.py stop || true
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose down -v --remove-orphans
          python3 scripts/devctl.py up contracts
          python3 scripts/export-openapi-contracts.py --check
          python3 scripts/smoke-test-runtime.py
          ./scripts/audit-code-contracts.sh

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-service-logs
          path: .dev-runtime/logs
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
