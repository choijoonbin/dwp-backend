name: Backend quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - dwp-dev

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DWP_AGENT_EVIDENCE_ROOT: ${{ github.workspace }}/.agent-evidence
      DWP_AGENT_EVIDENCE_REPOSITORY: https://github.com/choijoonbin/aura_agent

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out immutable Agent owner-PEP evidence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: choijoonbin/aura_agent
          ref: 72e991be3d8a2bde2228eb5f52b7c76330686aeb
          path: .agent-evidence
          fetch-depth: 1

      - name: Install uv for Agent evidence
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.28'
          enable-cache: true

      - name: Execute immutable Agent owner-PEP evidence
        working-directory: .agent-evidence
        run: |
          uv python install 3.13
          uv sync --locked --all-groups --python 3.13
          uv run pytest \
            tests/test_product_surface_pep.py::test_rejects_cross_tenant_scope_at_agent_owner_pep \
            tests/test_product_surface_pep.py::test_rejects_canonical_opaque_scope_escape_at_agent_owner_pep \
            tests/test_product_surface_pep.py::test_rejects_stale_authority_revision_at_agent_owner_pep \
            tests/test_product_surface_pep.py::test_rejects_normal_support_confused_deputy_at_agent_owner_pep \
            tests/test_product_surface_pep.py::test_rejects_internal_header_spoof_at_agent_owner_boundary \
            tests/test_product_surface_pep.py::test_executes_page_data_action_through_agent_owner_pep \
            tests/test_product_surface_pep.py::test_v4_draft_contract_exposes_exact_dwaion_consumer_metadata \
            tests/test_product_surface_pep.py::test_malformed_candidate_and_rollout_evidence_fail_closed \
            tests/test_product_surface_pep.py::test_candidate_scope_is_exact_and_leaves_legacy_siblings_ungoverned

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Run backend quality gates
        run: ./gradlew --no-daemon check

      - name: Generate aggregate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom

      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-cyclonedx-sbom
          path: build/reports/cyclonedx/
          if-no-files-found: error
          retention-days: 30

      - name: Validate migrations and code contracts
        shell: bash
        env:
          DWP_DEVCTL_STARTUP_TIMEOUT_SECONDS: '300'
        run: |
          set -Eeuo pipefail

          cleanup() {
            python3 scripts/devctl.py stop || true
            docker compose down -v --remove-orphans || true
          }
          trap cleanup EXIT

          docker compose down -v --remove-orphans
          python3 scripts/devctl.py up contracts
          python3 scripts/export-openapi-contracts.py --check
          python3 scripts/smoke-test-runtime.py
          ./scripts/audit-code-contracts.sh

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-service-logs
          path: .dev-runtime/logs
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
