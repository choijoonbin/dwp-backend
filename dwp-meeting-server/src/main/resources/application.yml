server:
  port: 8009

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-meeting-server
  jpa:
    open-in-view: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MEETING_DB_NAME:dwp_meetings}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  flyway:
    enabled: true
    locations: ${DWP_MEETING_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:2048}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  meeting:
    service-token: ${DWP_MEETING_SERVICE_TOKEN:}
    # v4 remains a DRAFT contract candidate. Exact enforcement cannot activate
    # until the immutable bundle and owner-service attack evidence are released.
    product-authorization-v4-enabled: ${DWP_MEETING_PRODUCT_AUTHORIZATION_V4_ENABLED:false}
    provider: ${DWP_MEETING_PROVIDER:disabled}
    token-ttl: ${DWP_MEETING_TOKEN_TTL:PT5M}
    join-code-length: ${DWP_MEETING_JOIN_CODE_LENGTH:12}
    recording-policy: ${DWP_MEETING_RECORDING_POLICY:NEVER}
    intelligence:
      provider: ${DWP_MEETING_INTELLIGENCE_PROVIDER:disabled}
      base-url: ${DWP_MEETING_INTELLIGENCE_BASE_URL:}
      allowed-hosts: ${DWP_MEETING_INTELLIGENCE_ALLOWED_HOSTS:}
      service-token: ${DWP_MEETING_INTELLIGENCE_SERVICE_TOKEN:}
      assertion-key-id: ${DWP_MEETING_INTELLIGENCE_ASSERTION_KEY_ID:}
      assertion-secret-base64: ${DWP_MEETING_INTELLIGENCE_ASSERTION_SECRET_BASE64:}
      assertion-ttl: ${DWP_MEETING_INTELLIGENCE_ASSERTION_TTL:PT30S}
      connect-timeout: ${DWP_MEETING_INTELLIGENCE_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${DWP_MEETING_INTELLIGENCE_REQUEST_TIMEOUT:PT15S}
      maximum-response-bytes: ${DWP_MEETING_INTELLIGENCE_MAX_RESPONSE_BYTES:2000000}
      retention:
        enabled: ${DWP_MEETING_INTELLIGENCE_RETENTION_ENABLED:false}
        batch-size: ${DWP_MEETING_INTELLIGENCE_RETENTION_BATCH_SIZE:100}
        poll-delay: ${DWP_MEETING_INTELLIGENCE_RETENTION_POLL_DELAY:PT5M}
        lease-duration: ${DWP_MEETING_INTELLIGENCE_RETENTION_LEASE_DURATION:PT1M}
        worker-id: ${DWP_MEETING_INTELLIGENCE_RETENTION_WORKER_ID:meeting-retention-worker}
    transcript-source:
      provider: ${DWP_MEETING_TRANSCRIPT_PROVIDER:disabled}
      base-url: ${DWP_MEETING_TRANSCRIPT_BASE_URL:}
      allowed-hosts: ${DWP_MEETING_TRANSCRIPT_ALLOWED_HOSTS:}
      service-token: ${DWP_MEETING_TRANSCRIPT_SERVICE_TOKEN:}
      connect-timeout: ${DWP_MEETING_TRANSCRIPT_CONNECT_TIMEOUT:PT2S}
      request-timeout: ${DWP_MEETING_TRANSCRIPT_REQUEST_TIMEOUT:PT10S}
      maximum-response-bytes: ${DWP_MEETING_TRANSCRIPT_MAX_RESPONSE_BYTES:5000000}
    transcript-finalization:
      service-token: ${DWP_MEETING_TRANSCRIPT_FINALIZATION_TOKEN:}
      assertion-key-id: ${DWP_MEETING_TRANSCRIPT_FINALIZATION_ASSERTION_KEY_ID:}
      assertion-secret-base64: ${DWP_MEETING_TRANSCRIPT_FINALIZATION_ASSERTION_SECRET_BASE64:}
    livekit:
      api-url: ${LIVEKIT_API_URL:}
      client-url: ${LIVEKIT_URL:}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.meeting: ${LOG_LEVEL_MEETING:INFO}
