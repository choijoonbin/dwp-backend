services:
  postgres:
    image: postgres:18.4-alpine
    container_name: dwp-postgres
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: dwp_user
      POSTGRES_PASSWORD: dwp_password
      POSTGRES_DB: dwp_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwp_user -d dwp_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dwp-network

  redis:
    image: redis:7.4-alpine
    container_name: dwp-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - dwp_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dwp_redis_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dwp-network

  livekit:
    image: livekit/livekit-server:v1.12.0
    container_name: dwp-livekit
    profiles: ["media"]
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - dwp-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: dwp-kafka
    profiles: ["events"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dwp-network

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: dwp-kafka-init
    profiles: ["events"]
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic dwp.domain-events.v1
        --partitions 12
        --replication-factor 1
        --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.approval.events.v1
        --partitions 12 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.approval.events.v1.DLT
        --partitions 12 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.domain-events.v1.DLT
        --partitions 12 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.notification-delivery-critical.v1
        --partitions 6 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.notification-delivery-interactive.v1
        --partitions 12 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092
        --create --if-not-exists --topic dwp.notification-delivery-bulk.v1
        --partitions 12 --replication-factor 1 --config cleanup.policy=delete
        --config min.insync.replicas=1
    networks:
      - dwp-network

volumes:
  postgres_data_v18:
  redis_data:
  kafka_data:

networks:
  dwp-network:
    driver: bridge
