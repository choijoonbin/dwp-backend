services:
  postgres:
    image: postgres:15-alpine
    container_name: dwp-postgres
    environment:
      POSTGRES_USER: dwp_user
      POSTGRES_PASSWORD: dwp_password
      POSTGRES_DB: dwp_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwp_user -d dwp_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dwp-network

volumes:
  postgres_data:

networks:
  dwp-network:
    driver: bridge
