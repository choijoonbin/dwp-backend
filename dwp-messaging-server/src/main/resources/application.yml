server:
  port: 8007

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-messaging-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MESSAGING_DB_NAME:dwp_messaging}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${DWP_MESSAGING_REDIS_SSL_ENABLED:false}
      timeout: ${DWP_MESSAGING_REDIS_TIMEOUT:2s}
      connect-timeout: ${DWP_MESSAGING_REDIS_CONNECT_TIMEOUT:2s}
  flyway:
    enabled: true
    locations: ${DWP_MESSAGING_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  events:
    transport: ${DWP_MESSAGING_EVENT_TRANSPORT:kafka}
    transport-enabled: ${DWP_MESSAGING_EVENT_TRANSPORT_ENABLED:true}
    topic: ${DWP_DOMAIN_EVENT_TOPIC:dwp.domain-events.v1}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_MESSAGING_EVENT_BATCH_SIZE:100}
    poll-interval: ${DWP_MESSAGING_EVENT_POLL_INTERVAL:PT1S}
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  messaging:
    service-token: ${DWP_MESSAGING_SERVICE_TOKEN:}
    work-source-token: ${DWP_MESSAGING_WORK_SOURCE_TOKEN:}
    home-runtime-service-token: ${DWP_MESSAGING_HOME_RUNTIME_SERVICE_TOKEN:}
    product-authorization-v4-enabled: ${DWP_MESSAGING_PRODUCT_AUTHORIZATION_V4_ENABLED:false}
    sse-timeout: ${DWP_MESSAGING_SSE_TIMEOUT:30m}
    sse-heartbeat: ${DWP_MESSAGING_SSE_HEARTBEAT:15s}
    realtime:
      redis-enabled: ${DWP_MESSAGING_REDIS_ENABLED:true}
      channel-prefix: ${DWP_MESSAGING_REDIS_CHANNEL_PREFIX:dwp.messaging.signal.v1}
      typing-channel-prefix: ${DWP_MESSAGING_TYPING_CHANNEL_PREFIX:dwp.messaging.typing.v1}
      typing-key-prefix: ${DWP_MESSAGING_TYPING_KEY_PREFIX:dwp:messaging:typing:v1}
      typing-ttl: ${DWP_MESSAGING_TYPING_TTL:8s}
      shard-count: ${DWP_MESSAGING_REDIS_SHARD_COUNT:32}
      readiness-probe-timeout: ${DWP_MESSAGING_REDIS_READINESS_PROBE_TIMEOUT:PT1S}
    presence:
      enabled: ${DWP_MESSAGING_PRESENCE_ENABLED:true}
      ttl: ${DWP_MESSAGING_PRESENCE_TTL:75s}
      refresh-after: ${DWP_MESSAGING_PRESENCE_REFRESH_AFTER:20s}
      key-prefix: ${DWP_MESSAGING_PRESENCE_KEY_PREFIX:dwp:messaging:presence:v1}
      active-user-warning-threshold: ${DWP_MESSAGING_PRESENCE_ACTIVE_USER_WARNING_THRESHOLD:${DWP_MESSAGING_PRESENCE_MAXIMUM_ACTIVE_USERS:5000}}
    readiness:
      initial-delay: ${DWP_MESSAGING_READINESS_INITIAL_DELAY:PT10S}
      interval: ${DWP_MESSAGING_READINESS_INTERVAL:PT1M}
      maximum-age: ${DWP_MESSAGING_READINESS_MAXIMUM_AGE:PT3M}
      notification-outbox-maximum-age: ${DWP_MESSAGING_NOTIFICATION_OUTBOX_MAXIMUM_AGE:PT5M}
      notification-outbox-warning-threshold: ${DWP_MESSAGING_NOTIFICATION_OUTBOX_WARNING_THRESHOLD:1000}
    retention:
      enabled: ${DWP_MESSAGING_RETENTION_ENABLED:false}
      mode: ${DWP_MESSAGING_RETENTION_MODE:DRY_RUN}
      paused: ${DWP_MESSAGING_RETENTION_PAUSED:false}
      hold-authority-ready: ${DWP_MESSAGING_RETENTION_HOLD_AUTHORITY_READY:false}
      downstream-lifecycle-ready: ${DWP_MESSAGING_RETENTION_DOWNSTREAM_LIFECYCLE_READY:false}
      batch-size: ${DWP_MESSAGING_RETENTION_BATCH_SIZE:100}
      maximum-batches-per-run: ${DWP_MESSAGING_RETENTION_MAXIMUM_BATCHES_PER_RUN:10}
      maximum-attachment-deletes-per-run: ${DWP_MESSAGING_RETENTION_MAXIMUM_ATTACHMENT_DELETES_PER_RUN:1000}
      lease-duration: ${DWP_MESSAGING_RETENTION_LEASE_DURATION:PT15M}
      evidence-maximum-age: ${DWP_MESSAGING_RETENTION_EVIDENCE_MAXIMUM_AGE:PT2H}
      initial-delay: ${DWP_MESSAGING_RETENTION_INITIAL_DELAY:PT5M}
      interval: ${DWP_MESSAGING_RETENTION_INTERVAL:PT1H}
    scheduled-delivery:
      enabled: ${DWP_MESSAGING_SCHEDULED_DELIVERY_ENABLED:true}
      batch-size: ${DWP_MESSAGING_SCHEDULED_DELIVERY_BATCH_SIZE:20}
      maximum-attempts: ${DWP_MESSAGING_SCHEDULED_DELIVERY_MAXIMUM_ATTEMPTS:5}
      poll-ms: ${DWP_MESSAGING_SCHEDULED_DELIVERY_POLL_MS:5000}
      heartbeat-maximum-age: ${DWP_MESSAGING_SCHEDULED_DELIVERY_HEARTBEAT_MAXIMUM_AGE:PT2M}
      overdue-maximum-age: ${DWP_MESSAGING_SCHEDULED_DELIVERY_OVERDUE_MAXIMUM_AGE:PT2M}
      health-initial-delay: ${DWP_MESSAGING_SCHEDULED_DELIVERY_HEALTH_INITIAL_DELAY:PT10S}
      health-interval: ${DWP_MESSAGING_SCHEDULED_DELIVERY_HEALTH_INTERVAL:PT1M}
    meeting:
      provider: ${DWP_MESSAGING_MEETING_PROVIDER:disabled}
      token-ttl: ${DWP_MESSAGING_MEETING_TOKEN_TTL:PT5M}
      livekit:
        api-url: ${LIVEKIT_API_URL:}
        client-url: ${LIVEKIT_URL:}
        api-key: ${LIVEKIT_API_KEY:}
        api-secret: ${LIVEKIT_API_SECRET:}
    attachments:
      storage: ${DWP_MESSAGING_ATTACHMENT_STORAGE:local}
      local-root: ${DWP_MESSAGING_ATTACHMENT_LOCAL_ROOT:.dwp-data/messaging-attachments}
      scanner: ${DWP_MESSAGING_ATTACHMENT_SCANNER:local}
      upload-ttl: ${DWP_MESSAGING_ATTACHMENT_UPLOAD_TTL:PT10M}
      download-ttl: ${DWP_MESSAGING_ATTACHMENT_DOWNLOAD_TTL:PT1M}
      maximum-transfer-mb: ${DWP_MESSAGING_ATTACHMENT_MAXIMUM_TRANSFER_MB:100}
      maximum-concurrent-transfers: ${DWP_MESSAGING_ATTACHMENT_MAXIMUM_CONCURRENT_TRANSFERS:2}
      cleanup-initial-delay: ${DWP_MESSAGING_ATTACHMENT_CLEANUP_INITIAL_DELAY:PT1M}
      cleanup-interval: ${DWP_MESSAGING_ATTACHMENT_CLEANUP_INTERVAL:PT5M}
      clamav-host: ${DWP_MESSAGING_CLAMAV_HOST:localhost}
      clamav-port: ${DWP_MESSAGING_CLAMAV_PORT:3310}
      clamav-timeout: ${DWP_MESSAGING_CLAMAV_TIMEOUT:PT10S}
      s3:
        bucket: ${DWP_MESSAGING_ATTACHMENT_S3_BUCKET:}
        region: ${DWP_MESSAGING_ATTACHMENT_S3_REGION:ap-northeast-2}
        endpoint: ${DWP_MESSAGING_ATTACHMENT_S3_ENDPOINT:}
        path-style-access: ${DWP_MESSAGING_ATTACHMENT_S3_PATH_STYLE:false}
        prefix: ${DWP_MESSAGING_ATTACHMENT_S3_PREFIX:dwp-messaging/quarantine}
        kms-key-id: ${DWP_MESSAGING_ATTACHMENT_S3_KMS_KEY_ID:}

management:
  health:
    redis:
      enabled: ${DWP_MESSAGING_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        presence:
          include: messagingPresenceHealth
          show-components: always
          show-details: always
        retention:
          include: messagingRetentionHealth
          show-components: always
          show-details: always
        scheduled-delivery:
          include: messagingScheduledDeliveryHealth
          show-components: always
          show-details: always
        messaging-operations:
          include: messagingPresenceHealth,messagingRetentionHealth,messagingScheduledDeliveryHealth,messagingProviderReadinessHealth
          show-components: always
          show-details: always
        messaging-providers:
          include: messagingProviderReadinessHealth
          show-components: always
          show-details: always

logging:
  level:
    com.dwp.services.messaging: ${LOG_LEVEL_MESSAGING:INFO}
