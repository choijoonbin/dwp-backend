dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.17'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation platform('software.amazon.awssdk:bom:2.53.3')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:kms'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.5.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.86'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    implementation project(':dwp-core')
    implementation project(':dwp-audit')
    implementation project(':dwp-observability')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.networknt:json-schema-validator:1.5.9'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.postgresql:postgresql'
}
