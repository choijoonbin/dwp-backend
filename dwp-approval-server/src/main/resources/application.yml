server:
  port: 8005

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_traceidratio}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:0.1}

springdoc:
  api-docs:
    enabled: ${DWP_OPENAPI_ENABLED:false}

spring:
  application:
    name: dwp-approval-server
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        compression.type: zstd
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${APPROVAL_DB_NAME:dwp_approval}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: ${DWP_APPROVAL_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

dwp:
  identity-sync:
    auth-url: ${SERVICE_AUTH_URL:http://localhost:8001}
    token: ${DWP_IDENTITY_SYNC_TOKEN:}
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  approval:
    service-token: ${DWP_APPROVAL_SERVICE_TOKEN:}
    runtime-service-token: ${DWP_APPROVAL_RUNTIME_SERVICE_TOKEN:}
    product-authorization-v2-enabled: ${DWP_APPROVAL_PRODUCT_AUTHORIZATION_V2_ENABLED:false}
    # Forward-only gate. Enable only after every Approval pod advertises the
    # management-scope-v1 compatibility fence; never use old-binary rollback.
    management-scope-writes-enabled: ${DWP_APPROVAL_MANAGEMENT_SCOPE_WRITES_ENABLED:false}
    management-scope-cluster-fence-confirmed: ${DWP_APPROVAL_MANAGEMENT_SCOPE_CLUSTER_FENCE_CONFIRMED:false}
    step-up:
      public-key-pem: ${DWP_APPROVAL_STEP_UP_PUBLIC_KEY_PEM:}
      issuer: ${DWP_APPROVAL_STEP_UP_ISSUER:}
      audience: ${DWP_APPROVAL_STEP_UP_AUDIENCE:dwp-approval-server}
      key-id: ${DWP_APPROVAL_STEP_UP_KEY_ID:}
      required-acr: ${DWP_APPROVAL_STEP_UP_REQUIRED_ACR:urn:dwp:acr:mfa}
      maximum-authentication-age-seconds: ${DWP_APPROVAL_STEP_UP_MAX_AUTH_AGE_SECONDS:600}
      maximum-challenge-ttl-seconds: ${DWP_APPROVAL_STEP_UP_MAX_TTL_SECONDS:900}
    external-signature-enabled: ${DWP_APPROVAL_EXTERNAL_SIGNATURE_ENABLED:false}
    integration-relay:
      enabled: ${DWP_APPROVAL_INTEGRATION_RELAY_ENABLED:false}
      topic: ${DWP_APPROVAL_INTEGRATION_TOPIC:dwp.approval.events.v1}
      batch-size: ${DWP_APPROVAL_INTEGRATION_BATCH_SIZE:50}
      maximum-attempts: ${DWP_APPROVAL_INTEGRATION_MAXIMUM_ATTEMPTS:10}
      poll-delay-ms: ${DWP_APPROVAL_INTEGRATION_POLL_DELAY_MS:2000}
    recovery-auditor-assignment:
      enabled: ${DWP_APPROVAL_RECOVERY_AUDITOR_ASSIGNMENT_ENABLED:false}
      auth-url: ${SERVICE_AUTH_URL:http://localhost:8001}
      token: ${DWP_APPROVAL_RECOVERY_AUDITOR_TOKEN:}
      batch-size: ${DWP_APPROVAL_RECOVERY_AUDITOR_BATCH_SIZE:50}
      lease-seconds: ${DWP_APPROVAL_RECOVERY_AUDITOR_LEASE_SECONDS:30}
      maximum-attempts: ${DWP_APPROVAL_RECOVERY_AUDITOR_MAXIMUM_ATTEMPTS:10}
      probe-cooldown-seconds: ${DWP_APPROVAL_RECOVERY_AUDITOR_PROBE_COOLDOWN_SECONDS:86400}
      maximum-probe-cooldown-seconds: ${DWP_APPROVAL_RECOVERY_AUDITOR_MAX_PROBE_COOLDOWN_SECONDS:604800}
      poll-delay-ms: ${DWP_APPROVAL_RECOVERY_AUDITOR_POLL_DELAY_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.approval: ${LOG_LEVEL_APPROVAL:INFO}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 50
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 70
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
  retry:
    configs:
      idempotent:
        max-attempts: 2
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      idempotentInternal:
        base-config: idempotent
