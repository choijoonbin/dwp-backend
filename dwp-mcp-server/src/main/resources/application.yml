server:
  port: 8086

spring:
  application:
    name: dwp-mcp-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dwp_aura}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  main:
    banner-mode: console

auth:
  server:
    url: ${SERVICE_AUTH_URL:http://localhost:8001}

mcp:
  security:
    # 긴급 우회: Aura 서비스 계정 user_id allowlist (CSV). 비우면 미사용.
    service-account-user-ids: ${MCP_SERVICE_ACCOUNT_USER_IDS:}
    # allowlist user에 대해 허용할 tenant_id 목록(CSV). 비우면 전체 tenant 허용.
    service-account-tenant-ids: ${MCP_SERVICE_ACCOUNT_TENANT_IDS:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    "[com.dwp.services.mcp]": DEBUG
