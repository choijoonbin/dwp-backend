server:
  port: 8001

spring:
  application:
    name: dwp-auth-server
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dwp_auth}
    username: ${DB_USERNAME:dwp_user}
    password: ${DB_PASSWORD:dwp_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:dwp_redis_password}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

jwt:
  secret: ${JWT_SECRET:your_shared_secret_key_must_be_at_least_256_bits_long_for_HS256}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

dwp:
  audit:
    collector-url: ${DWP_AUDIT_COLLECTOR_URL:}
    ingest-token: ${DWP_AUDIT_INGEST_TOKEN:}
    environment: ${DWP_ENVIRONMENT:local}
    service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
    batch-size: ${DWP_AUDIT_BATCH_SIZE:100}
    poll-interval: ${DWP_AUDIT_POLL_INTERVAL:PT2S}
  identity-sync:
    token: ${DWP_IDENTITY_SYNC_TOKEN:}
  provider:
    provisioning-token: ${DWP_PROVIDER_PROVISIONING_TOKEN:}
  observability:
    api-history:
      enabled: ${DWP_API_HISTORY_ENABLED:true}
      collector-url: ${DWP_API_HISTORY_COLLECTOR_URL:}
      ingest-token: ${DWP_API_HISTORY_INGEST_TOKEN:}
      privacy-hash-secret: ${DWP_API_HISTORY_PRIVACY_HASH_SECRET:}
      environment: ${DWP_ENVIRONMENT:local}
      service-instance: ${DWP_SERVICE_INSTANCE:${HOSTNAME:local}}
      queue-capacity: ${DWP_API_HISTORY_QUEUE_CAPACITY:4096}
      batch-size: ${DWP_API_HISTORY_BATCH_SIZE:100}
      flush-interval: ${DWP_API_HISTORY_FLUSH_INTERVAL:PT1S}
  security:
    login:
      maximum-failures: ${DWP_LOGIN_MAXIMUM_FAILURES:5}
      lock-duration-seconds: ${DWP_LOGIN_LOCK_DURATION_SECONDS:900}
    session:
      cookie-name: ${DWP_SESSION_COOKIE_NAME:DWP_SESSION}
      cookie-secure: ${DWP_SESSION_COOKIE_SECURE:false}
      same-site: ${DWP_SESSION_COOKIE_SAME_SITE:Lax}
      idle-timeout-seconds: ${DWP_SESSION_IDLE_TIMEOUT_SECONDS:1800}
      rotation-minimum-age-seconds: ${DWP_SESSION_ROTATION_MINIMUM_AGE_SECONDS:600}
      previous-token-grace-seconds: ${DWP_SESSION_PREVIOUS_TOKEN_GRACE_SECONDS:30}
      activity-touch-interval-seconds: ${DWP_SESSION_ACTIVITY_TOUCH_INTERVAL_SECONDS:60}
  scim:
    base-url: ${DWP_SCIM_BASE_URL:http://localhost:8080/scim/v2}
    cursor-secret: ${DWP_SCIM_CURSOR_SECRET:local-development-scim-cursor-secret-change-me}
    cursor-ttl-seconds: ${DWP_SCIM_CURSOR_TTL_SECONDS:900}

sso:
  callback-url: ${SSO_CALLBACK_URL:http://localhost:4200/auth/oidc/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.dwp.services.auth: ${LOG_LEVEL_AUTH:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
